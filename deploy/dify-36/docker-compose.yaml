# Dify 1.17.1 —— 36 上这套独立实例的 compose（#579 / PRD #577）
#
# 这份文件是从上游 `langgenius/dify` 1.17.1 的 `docker/docker-compose.yaml`
# **裁剪**而来，不是手写：
#   upstream ref: 8387590ace4a094de812b7847fc6a4c3a27cd52b (tag: 1.17.1)
# 裁剪依据是 PRD #577 的容器集决定（8 个 + nginx 单一入口 = 9 个，向量库 0 个）：
#
#   保留：init_permissions, api, worker, web, db_postgres, redis,
#         plugin_daemon, ssrf_proxy, nginx
#   删除（并记明理由）：
#     worker_beat         —— 只跑定时清理与插件升级检查；唯一一次外呼是
#                            marketplace（见 README「被删掉的服务」）
#     sandbox             —— Code 节点才用；本实例不需要
#     local_sandbox       —— Dify 自有 Agent runtime 才用；智能体定义在我们侧
#     agent_backend       —— 同上（api/worker 对它的依赖是 REQUIRED，故必须显式移除）
#     agent_ssrf_proxy    —— 只服务 local_sandbox
#     全部向量库 profile   —— 向量初始化是惰性的，知识面全走 External Knowledge API
#     api_websocket       —— collaboration profile；非协作模式下 socket.io 由 api 承担
#     db_mysql / oceanbase / seekdb / certbot —— 不用
#   nginx 的 `/socket.io/` 因此改指 api（见 README，`NGINX_SOCKET_IO_UPSTREAM`）。
#
# 2026-10-20 修订：**新增 weaviate（向量库 1 个）**。原判断「向量库 0 个，因为知识面
# 全走 External Knowledge API」在"运营在控制台里自建 vendor 数据集"这条路上不成立 ——
# 实际发生过一次：文档 1564 个分段全部停在 indexing，`documents.error` 是
# `Vector store must be specified.`，`embeddings` 表 0 行。没有向量库时，vendor 数据集
# 的索引根本没有落点，而失败只体现在一行 error 上。见 README「向量库」。
#
# 2026-10-20 修订：**api/worker 挂载上游补丁树**。三处上游 1.17.1 还不支持的行为
# （external 数据集的 /v1/.../retrieve、API 模板 api_key 落库加密、删库清理外部绑定）
# 以 `patches/1.17.1/*.patch` 打在镜像原文件上，见 `patches/apply.sh` 与 README「上游补丁」。
#
# 镜像来源：Docker Hub 在 36 不可达（registry-1.docker.io 连接被重置）。这里**不**
# 改 docker daemon（那要重启 dockerd，会把 36 上的生产栈一起抖），而是在 compose
# 里直接写镜像源前缀 —— 换一行就能回退，爆炸半径只有本栈。见 README「镜像来源」。
#
# 容器入口：只有 nginx 发布端口，固定回环 127.0.0.1:10018。
# 既有浏览器入口由宿主 nginx 的 10008 承担；其余服务只在 compose 内网。
# 公网控制台 TLS 与访问收口仍是独立待办，内部回环不代表公网已收口。

# 上游补丁树：`patches/apply.sh` 从**同一镜像**取原文件、核对 sha256、打补丁后输出到
# ./volumes/app/patched-api/。**逐个文件挂**（挂目录会把整个 /app/api 遮住）。
# 文件由 apply.sh 置成 0444（api 以 uid 1001 跑，只需可读）；`:ro` 再加一道。
# 镜像一换，apply.sh 的 sha 核对就会失败，不会静默挂上一份陈旧补丁。
# 写成 x- 键下的逐项锚点，是因为 api 与 worker 各自的 `volumes:` 会覆盖共享锚点里的
# 同名键（YAML 合并键按整键覆盖）—— 整段复制成两份比现在更糟。
x-patched-api-mounts:
  - &pm_hit_testing_base ./volumes/app/patched-api/controllers/console/datasets/hit_testing_base.py:/app/api/controllers/console/datasets/hit_testing_base.py:ro
  - &pm_external ./volumes/app/patched-api/controllers/console/datasets/external.py:/app/api/controllers/console/datasets/external.py:ro
  - &pm_service_hit_testing ./volumes/app/patched-api/controllers/service_api/dataset/hit_testing.py:/app/api/controllers/service_api/dataset/hit_testing.py:ro
  - &pm_external_knowledge ./volumes/app/patched-api/services/external_knowledge_service.py:/app/api/services/external_knowledge_service.py:ro
  - &pm_dataset_service ./volumes/app/patched-api/services/dataset_service.py:/app/api/services/dataset_service.py:ro
  - &pm_plugin ./volumes/app/patched-api/controllers/console/workspace/plugin.py:/app/api/controllers/console/workspace/plugin.py:ro

x-shared-api-worker: &shared-api-worker
  image: ${DIFY_REGISTRY:-docker.1panel.live}/langgenius/dify-api:1.17.1
  env_file:
    - ./.env
  restart: always
  networks:
    - ssrf_proxy_network
    - default

services:
  # 首次启动时把存储目录的属主交给 api 容器内的非 root 用户（1001）。
  #
  # **为什么去掉上游的 flag 文件幂等**：上游用 `/app/api/storage/.init_permissions`
  # 做幂等，但那个 flag **就落在它要保护的卷里** —— 一旦某次 chown 没生效而 touch
  # 生效了，flag 就永久锁住"已初始化"，之后每次 up 都早早退出，目录永远留在 root，
  # 而 api 以 uid 1001 跑，写 `privkeys/…` 时 `Permission denied`（症状见 README
  # 「落地期踩到的五处」第 3 点）。对一个只有个位数文件的目录，每次 up 都 chown 的
  # 代价可以忽略 —— 用"总是修"换掉"记住修过了"，这个不变式就不再依赖历史。
  #
  # **第二件事**：给 postgres 数据目录的挂载根补 o+x。postgres 的 entrypoint 会以
  # root 进去、chown 数据目录、再 `exec gosu postgres` 以 uid 70 重跑自己；若
  # `PGDATA` 尚不存在，是 **uid 70** 去 mkdir 它 —— 挂载根 `770 root:root` 时 uid 70
  # 穿不过，容器直接退出，症状是服务端"看着在跑"但任何真实连接都读不到
  # `pg_filenode.map`。实测 770 必挂。见 README 第 3 点。
  init_permissions:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/library/busybox:latest
    command:
      - sh
      - -c
      - |
        set -e
        echo "Ensuring postgres data dir mount root is traversable by uid 70"
        mkdir -p /db-data
        chmod o+x /db-data
        echo "Initializing permissions for /app/api/storage"
        # 清掉历史 flag（旧版本留下的、锁住幂等的那个），再无条件 chown。
        rm -f /app/api/storage/.init_permissions
        chown -R 1001:1001 /app/api/storage
        echo "Permissions initialized. Exiting."
    volumes:
      - ./volumes/app/storage:/app/api/storage
      - ./volumes/db/data:/db-data
    restart: "no"

  api:
    <<: *shared-api-worker
    environment:
      MODE: api
      # api 拨 plugin_daemon 的地址。**必须显式给** —— 见 env.example 同名的说明：
      # api 侧默认 `http://localhost:5002`，那是上游"把 5002 发布到宿主"的形状；
      # 本实例不发布内部端口，默认值就指向空处（插件路径 Errno 111，探活却 200）。
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      PLUGIN_REMOTE_INSTALL_HOST: ${EXPOSE_PLUGIN_DEBUGGING_HOST:-localhost}
      PLUGIN_REMOTE_INSTALL_PORT: ${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PLUGIN_DAEMON_TIMEOUT: ${PLUGIN_DAEMON_TIMEOUT:-600.0}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      weaviate:
        condition: service_healthy
    volumes:
      - ./volumes/app/storage:/app/api/storage
      - *pm_hit_testing_base
      - *pm_external
      - *pm_service_hit_testing
      - *pm_external_knowledge
      - *pm_dataset_service
      - *pm_plugin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Celery worker。本实例只有一处异步消费方（api 发出的任务），worker_beat 已删。
  worker:
    <<: *shared-api-worker
    environment:
      MODE: worker
      # 与 api 同一个理由（插件安装/依赖分析跑在 worker 上）：见 env.example。
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      weaviate:
        condition: service_healthy
    volumes:
      - ./volumes/app/storage:/app/api/storage
      - *pm_hit_testing_base
      - *pm_external
      - *pm_service_hit_testing
      - *pm_external_knowledge
      - *pm_dataset_service
      - *pm_plugin
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_healthcheck.celery inspect ping"]
      interval: ${COMPOSE_WORKER_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${COMPOSE_WORKER_HEALTHCHECK_TIMEOUT:-30s}
      retries: 3
      start_period: 60s
      disable: ${COMPOSE_WORKER_HEALTHCHECK_DISABLED:-true}

  web:
    # 默认仍是上游镜像；打过补丁的镜像由 DIFY_WEB_IMAGE 覆盖（见
    # web-patches/build-web-image.sh）。做成显式变量而不是直接换 image：
    # 没构建过补丁镜像的部署必须能原样跑起来，否则升级时 compose 会先坏掉。
    image: ${DIFY_WEB_IMAGE:-${DIFY_REGISTRY:-docker.1panel.live}/langgenius/dify-web:1.17.1}
    restart: always
    env_file:
      - ./.env
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-}
      SERVER_CONSOLE_API_URL: ${SERVER_CONSOLE_API_URL:-http://api:5001}
      APP_API_URL: ${APP_API_URL:-}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-ws://localhost}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-https://marketplace.dify.ai}
      TEXT_GENERATION_TIMEOUT_MS: ${TEXT_GENERATION_TIMEOUT_MS:-60000}
      ENABLE_WEBSITE_JINAREADER: ${ENABLE_WEBSITE_JINAREADER:-true}
      ENABLE_WEBSITE_FIRECRAWL: ${ENABLE_WEBSITE_FIRECRAWL:-true}
      ENABLE_WEBSITE_WATERCRAWL: ${ENABLE_WEBSITE_WATERCRAWL:-true}
    networks:
      - default

  db_postgres:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/library/postgres:15-alpine
    restart: always
    # 必须先让 init_permissions 把挂载根补上 o+x 再起 postgres —— 冷启动时两者
    # 原本并发，postgres 的 uid-70 mkdir 会和那次 chmod 抢跑（见 init_permissions
    # 注释与 README 第 3 点）。这条边把顺序钉死。
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1024MB}'
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db_postgres", "-U", "${DB_USERNAME:-postgres}", "-d", "${DB_DATABASE:-dify}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default

  redis:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/library/redis:6-alpine
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
    networks:
      - default

  plugin_daemon:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/langgenius/dify-plugin-daemon:0.6.10-local
    restart: always
    env_file:
      - ./.env
    environment:
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY}
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      THIRD_PARTY_SIGNATURE_VERIFICATION_ENABLED: ${THIRD_PARTY_SIGNATURE_VERIFICATION_ENABLED:-false}
      THIRD_PARTY_SIGNATURE_VERIFICATION_PUBLIC_KEYS: ${THIRD_PARTY_SIGNATURE_VERIFICATION_PUBLIC_KEYS:-}
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
      PLUGIN_INSTALLED_PATH: ${PLUGIN_INSTALLED_PATH:-plugin}
      PLUGIN_PACKAGE_CACHE_PATH: ${PLUGIN_PACKAGE_CACHE_PATH:-plugin_packages}
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
    volumes:
      - ./volumes/plugin_daemon:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
    networks:
      - ssrf_proxy_network
      - default

  # 向量库。本实例唯一的知识面落点；没有它，vendor 数据集的索引会停在
  # `Vector store must be specified.`（README「向量库」记了这次实测）。
  #
  # **不发布任何宿主端口**：只有 api/worker 经 compose 内网名 `weaviate:8080` 访问。
  # 版本跟上游 1.17.1 的 compose 钉在同一个小版本（1.39.2），镜像源同其余服务。
  weaviate:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/semitechnologies/weaviate:1.39.2
    restart: always
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: ${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
      QUERY_DEFAULTS_LIMIT: ${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED:-false}
      DEFAULT_VECTORIZER_MODULE: ${WEAVIATE_DEFAULT_VECTORIZER_MODULE:-none}
      CLUSTER_HOSTNAME: ${WEAVIATE_CLUSTER_HOSTNAME:-node1}
      AUTHENTICATION_APIKEY_ENABLED: ${WEAVIATE_AUTHENTICATION_APIKEY_ENABLED:-true}
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?WEAVIATE_API_KEY 未设置}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_AUTHENTICATION_APIKEY_USERS:-hello@dify.ai}
      AUTHORIZATION_ADMINLIST_ENABLED: ${WEAVIATE_AUTHORIZATION_ADMINLIST_ENABLED:-true}
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_AUTHORIZATION_ADMINLIST_USERS:-hello@dify.ai}
      DISABLE_TELEMETRY: ${WEAVIATE_DISABLE_TELEMETRY:-true}
    networks:
      - default
    healthcheck:
      # 该镜像里没有 curl（实测只有 busybox 的 wget），用 wget 探就绪端点。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 转发出站请求的 squid。发行版默认只放行 .marketplace.dify.ai 与本地网段，
  # 并以 `http_access deny all` 兜底 —— 直接打私有网段地址会被拦（PRD #577 记的坑）。
  # 本实例的处置写在 README「SSRF 处置」：**保留过滤**，用 SSRF_PROXY_ALLOW_PRIVATE_*
  # 显式加白名单，而不是清空它。
  ssrf_proxy:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/ubuntu/squid:latest
    restart: always
    volumes:
      - ./ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
      - ./ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    networks:
      - ssrf_proxy_network
      - default

  # 单一入口：console 与 web 都从这里进，只有它发布端口。
  nginx:
    image: ${DIFY_REGISTRY:-docker.1panel.live}/library/nginx:latest
    restart: always
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./nginx/https.conf.template:/etc/nginx/https.conf.template:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      # 阶段 1 明确无 TLS（见 README「暴露与收口」）。改 true 需要证书就位。
      NGINX_HTTPS_ENABLED: "false"
      NGINX_PORT: "80"
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_KEEPALIVE_TIMEOUT: ${NGINX_KEEPALIVE_TIMEOUT:-65}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-3600s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-3600s}
      NGINX_ENABLE_CERTBOT_CHALLENGE: "false"
      # 非协作模式（ENABLE_COLLABORATION_MODE=false）下没有 api_websocket 容器，
      # socket.io 由 api 进程承担 —— 所以这里指向 api，而不是上游默认的 api_websocket。
      NGINX_SOCKET_IO_UPSTREAM: ${NGINX_SOCKET_IO_UPSTREAM:-api:5001}
    depends_on:
      - api
      - web
    ports:
      # 只绑回环。对外入口是宿主 nginx 的 36:10008（ops/dify-console-bridge/），
      # 它转发到这里并注入发布按钮；绑 0.0.0.0 会让本口成为绕过注入层的第二条路。
      # 绑定地址写死在这里、不进变量：.env 只能改端口号，改不出对外暴露。
      - "127.0.0.1:${DIFY_EXPOSE_PORT:-10018}:80"
    networks:
      - default

networks:
  # 上游原样保留：内部网，禁止出网；sandbox/api/ssrf_proxy 之间用。
  ssrf_proxy_network:
    driver: bridge
    internal: true
  default:
    driver: bridge
