# APP-RUNTIME-02 隔离验收用的 Dify 1.17.1 栈
#
# **这不是现役部署**：现役在 36（`deploy/dify-36/`）。这一份只为验收存在，特征是
#
#   * 共用本次 driver 容器网络，全部业务监听仅在该命名空间，宿主不发布端口；
#   * 一次性数据根（`${DIFY_TEST_ROOT}/volumes`，只清本次创建的目录）；
#   * 不打任何生产补丁、不挂 36 的配置、不连 36 的任何东西；
#   * 模型供应商是本机合成的 OpenAI-compatible 服务（验收脚本起的回环桩）。
#
# 用 `docker compose -f docker-compose.acceptance.yaml` 起，不要与 deploy/dify-36 混用。
services:
  # 把存储目录属主交给 api 容器内的非 root 用户（1001）。**每次 up 都修**，不靠 flag 幂等：
  # 一个"记得修过了"的标记文件一旦先于 chown 生效，目录就永久留在 root，而 api 以 uid 1001
  # 跑 —— 症状是 setup 时报 `PermissionDenied ... privkeys/...private.pem`，看起来像密钥问题。
  init_permissions:
    image: ${DIFY_REGISTRY:-docker.io}/library/busybox:latest
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /app/api/storage /app/storage
        chown -R 1001:1001 /app/api/storage /app/storage
    volumes:
      - ${DIFY_TEST_ROOT}/volumes/app/storage:/app/api/storage
      - ${DIFY_TEST_ROOT}/volumes/plugin_daemon:/app/storage
    network_mode: "container:${DIFY_TEST_NAMESPACE}"

  db_postgres:
    image: ${DIFY_REGISTRY:-docker.io}/library/postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DIFY_TEST_ROOT}/volumes/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    network_mode: "container:${DIFY_TEST_NAMESPACE}"

  redis:
    image: ${DIFY_REGISTRY:-docker.io}/library/redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    network_mode: "container:${DIFY_TEST_NAMESPACE}"

  weaviate:
    image: ${DIFY_REGISTRY:-docker.io}/semitechnologies/weaviate:1.39.2
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    network_mode: "container:${DIFY_TEST_NAMESPACE}"

  api:
    image: ${DIFY_REGISTRY:-docker.io}/langgenius/dify-api:1.17.1
    env_file: ["${DIFY_TEST_ROOT}/dify.env"]
    environment:
      MODE: api
      PLUGIN_DAEMON_URL: http://127.0.0.1:5002
      PLUGIN_REMOTE_INSTALL_HOST: 127.0.0.1
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
    volumes:
      - ${DIFY_TEST_ROOT}/volumes/app/storage:/app/api/storage
    depends_on:
      init_permissions: {condition: service_completed_successfully}
      db_postgres: {condition: service_healthy}
      redis: {condition: service_started}
      weaviate: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    network_mode: "container:${DIFY_TEST_NAMESPACE}"

  worker:
    image: ${DIFY_REGISTRY:-docker.io}/langgenius/dify-api:1.17.1
    env_file: ["${DIFY_TEST_ROOT}/dify.env"]
    environment:
      MODE: worker
      PLUGIN_DAEMON_URL: http://127.0.0.1:5002
      PLUGIN_REMOTE_INSTALL_HOST: 127.0.0.1
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
    volumes:
      - ${DIFY_TEST_ROOT}/volumes/app/storage:/app/api/storage
    depends_on:
      init_permissions: {condition: service_completed_successfully}
      db_postgres: {condition: service_healthy}
      plugin_daemon: {condition: service_started}
      redis: {condition: service_started}
      weaviate: {condition: service_healthy}
    network_mode: "container:${DIFY_TEST_NAMESPACE}"

  plugin_daemon:
    image: ${DIFY_REGISTRY:-docker.io}/langgenius/dify-plugin-daemon:0.6.10-local
    env_file: ["${DIFY_TEST_ROOT}/dify.env"]
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_PLUGIN_DATABASE}
      SERVER_PORT: "5002"
      SERVER_KEY: ${PLUGIN_DAEMON_KEY}
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      PLUGIN_REMOTE_INSTALLING_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      DIFY_INNER_API_URL: http://127.0.0.1:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_WORKING_PATH: /app/storage/cwd
      GIN_MODE: release
    # 它要在**依赖健康之后**才起：实测它会在 DNS 就绪前连库失败退出（exit 2），
    # 而 `--wait` 会把那次退出读成"整个栈起不来"。
    depends_on:
      db_postgres: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - ${DIFY_TEST_ROOT}/volumes/plugin_daemon:/app/storage
    # **模型 provider 是插件**：1.17.1 里 `openai_api_compatible` 这类 provider 由
    # plugin_daemon 托管，LLM 步骤在运行时会去 `plugin/<id>/management/models` 要模型。
    # 它不健康，整轮会以 `Failed to request plugin daemon` 400 收场 —— 看起来像
    # "Dify 调用失败"，其实是**插件宿主没起来**。所以它必须有 healthcheck 且 etc.
    # 必须等它健康。
    network_mode: "container:${DIFY_TEST_NAMESPACE}"
    restart: "on-failure"
    # **不设 healthcheck**：这个镜像里没有 curl / wget / nc / ss，连 `/dev/tcp` 都不支持
    # （dash）。任何"容器内探活"在这里都只会让一个正常工作的容器永远报 unhealthy。
    # 就绪判定改由**宿主**做：验收脚本轮询 `POST /v1/workflows/run` 之前的
    # provider 探测（`_wait_model_provider`），而不是容器内探活。
