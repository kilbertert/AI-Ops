# M2-LIVE-03 受控试运行栈。**所有宿主端口绑回环**，不新增公网暴露。
#
# 起停用 `checks.sh`，不要直接 `docker compose up`：那份脚本会在起容器之前先做隔离与
# 产物检查，失败时干净地停下（不留半套栈）。
#
# 网络分四张：
#   trial      内部网络（internal: true）—— 容器之间互通，**没有出站 NAT**
#   modellink  内部网络（internal: true）—— 只有 node 与 model-proxy 在上面
#   egress     可出网 —— 只有真的需要外联的组件接它（平台、模型出口、隔离 Gateway 访问 CPMS）
#   hostloop   宿主回环依赖面 —— 只在 gateway-host-relay 上，别处不可见
# 节点只接 trial 与 modellink，所以它连不出宿主；模型调用走**固定目标**的受控出口。
#
# 凭据边界：平台与节点**不挂载** `/etc/aiops-41`；只有隔离 Gateway 只读挂载它。
#
# 运行身份：全部显式给出数字 UID/GID，不靠基础镜像默认。状态目录的属主必须在起栈前
# 就是这个 UID —— 隔离门禁会核对。

name: m2-live-03

# 基础镜像名由宿主决定：41 上 docker.io 直连不可达（实测 i/o timeout），镜像取自
# 宿主自己的加速前缀。下面三个变量的默认值不带前缀，开发机与任何能直连的环境行为
# 不变；41 上实际使用的镜像与镜像 ID 记在 `images.lock.json` 的 `base_images` 段。
# Gateway 用**构建出来的镜像**（`build-image.sh`），不是基础 python 镜像。

networks:
  trial:
    driver: bridge
    internal: true
  modellink:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  hostloop:
    driver: bridge

services:
  # 宿主回环依赖的中继。生产 Redis 在宿主回环 6379；隔离 Gateway 在 bridge 网络里，
  # 它的 127.0.0.1 不是宿主。这里把宿主回环映射进**仅 Gateway 可见**的一张网络，
  # 目标地址由部署件钉死，不接受请求参数。
  #
  # 只读：它不写任何状态；资源计入整栈预算。
  # 注意这不是「TLS 豁免」：Redis 本身就是明文协议，这里转发的是同一段明文；
  # 平台那一跳已改为真 HTTPS（见 make-certs.sh），不再经过中继。
  gateway-host-relay:
    image: ${M2LIVE_GATEWAY_IMAGE:?build the gateway image first (build-image.sh)}
    container_name: m2live03-host-relay
    # 只接 hostloop：本栈里只有 gateway 在这张网络上，平台与节点看不到它。
    networks: [hostloop]
    user: "${M2LIVE_UID:-999}:${M2LIVE_GID:-987}"
    entrypoint: ["python", "/opt/aiops-src/tools/m2_live/loopback_relay.py"]
    # 监听在所有接口上：hostloop 里只有 gateway 能看到它。目标固定为宿主回环，
    # 不通过环境变量泄露地址（后者会把「依赖在哪」变成可配置项）。
    command: ["--listen", "6379", "--listen-host", "0.0.0.0", "--target", "host-gateway:6379"]
    extra_hosts:
      - "host-gateway:host-gateway"
    mem_limit: 64m
    cpus: 0.05
    restart: unless-stopped

  # 受控模型出口。模型调用发生在**执行节点**进程里（`ClientChatExecutor` 在节点构造
  # ChatClient 并直接请求模型端点），而节点没有任意外联。这个出口只转发到一个固定目标，
  # 不接受请求里的 URL、不实现 CONNECT。真实供应商 key 只在这里；节点只拿到代理令牌。
  model-proxy:
    image: ${M2LIVE_GATEWAY_IMAGE:?build the gateway image first (build-image.sh)}
    container_name: m2live03-model-proxy
    networks: [modellink, egress]
    user: "${M2LIVE_UID:-999}:${M2LIVE_GID:-987}"
    entrypoint: ["python", "/opt/aiops-src/tools/m2_live/model_proxy.py"]
    environment:
      M2LIVE_MODEL_UPSTREAM: ${M2LIVE_MODEL_UPSTREAM:-}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/gateway:/etc/m2live:ro
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/tls/proxy:/etc/m2live-tls:ro
    command:
      - --listen-port
      - "9101"
      - --upstream
      - ${M2LIVE_MODEL_UPSTREAM:-}
      - --upstream-key-file
      - /etc/m2live/upstream_api_key
      - --proxy-token-file
      - /etc/m2live/proxy_token
    mem_limit: 128m
    cpus: 0.1
    restart: unless-stopped

  store:
    # 平台自己的元数据库。不是业务库，也不含任何公司凭据。
    image: ${M2LIVE_MYSQL_IMAGE:-mysql:8.0}
    container_name: m2live03-store
    networks: [trial]
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      MYSQL_DATABASE: snail_ai
    volumes:
      - ${M2LIVE_STATE:-/var/lib/aiops-m2-live}/store:/var/lib/mysql
      - ./schema:/docker-entrypoint-initdb.d:ro
    secrets: [mysql_root]
    # 官方入口点会先以 root 完成一次 initdb（数据目录属主就是 mysql 用户，
    # 此后长期以 mysql 运行）。这条短暂初始化不泛化到其它服务。
    user: "root"
    mem_limit: 700m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$(cat /run/secrets/mysql_root)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  platform:
    image: ${M2LIVE_JAVA_IMAGE:-eclipse-temurin:21-jdk}
    container_name: m2live03-platform
    networks: [trial, egress]
    depends_on:
      store: {condition: service_healthy}
    # 基础 JVM 镜像没有设 User（实测），不显式指定就会以 root 跑。
    user: "${M2LIVE_UID:-999}:${M2LIVE_GID:-987}"
    # 平台的 logback 把日志写到**相对工作目录**的 ./data/log；工作目录若落在只读
    # 的 jar 目录上，它会因为建不了目录而拒绝启动。这里钉到可写状态目录。
    working_dir: /var/lib/snail-ai
    command:
      - java
      - -Xmx900m
      - -jar
      - /opt/platform/snail-ai-server-exec.jar
      # 数据源、加密参数与 TLS 从只读配置文件读（0600），不写在命令行里。
      - --spring.config.additional-location=file:/etc/m2live/
    volumes:
      - ${M2LIVE_DIST:-/opt/aiops-m2-live}/platform:/opt/platform:ro
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/platform:/etc/m2live:ro
      # 平台只挂自己的私钥材料；公开证书留给其它容器。
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/tls/platform:/etc/m2live-tls:ro
      - ${M2LIVE_STATE:-/var/lib/aiops-m2-live}/platform:/var/lib/snail-ai
    mem_limit: 1200m
    cpus: 0.40
    # 8890 是平台的 **HTTPS** 面（TLS 材料见 make-certs.sh），18888 是节点注册用的
    # gRPC 端口。两个都只暴露在栈的内网，不映射到宿主。
    expose: ["8890", "18888"]
    restart: unless-stopped

  node:
    image: ${M2LIVE_JAVA_IMAGE:-eclipse-temurin:21-jdk}
    container_name: m2live03-node
    # modellink 只通向 model-proxy；trial 是栈内其余组件。两者都不可出网。
    networks: [trial, modellink]
    depends_on:
      platform: {condition: service_started}
    user: "${M2LIVE_UID:-999}:${M2LIVE_GID:-987}"
    environment:
      AIOPS_NODE_NAME: node-41
      AIOPS_NODE_BUILD: ${NODE_BUILD:-m2live03-node-1}
      AIOPS_NODE_GRPC_PORT: "18889"
      AIOPS_NODE_HTTP_PORT: "8081"
      AIOPS_NODE_HOST: node
      AIOPS_NODE_HOME: /home/node
      SNAIL_SERVER_HOST: platform
      SNAIL_SERVER_PORT: "18888"
      AIOPS_GATEWAY_BASE_URL: http://gateway:8794
      # 模型调用发生在**本进程**里；受控出口用本栈 CA 签发的证书，JVM 不认 SSL_CERT_FILE，
      # 所以给它一份只含该 CA 的 truststore。校验不可关闭。
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/etc/m2live-tls/truststore.p12
        -Djavax.net.ssl.trustStorePassword=m2live-trust
        -Djavax.net.ssl.trustStoreType=PKCS12
    env_file:
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/node/node.env
    command: ["java", "-jar", "/app/aiops-execution-node.jar"]
    volumes:
      - ${M2LIVE_DIST:-/opt/aiops-m2-live}/node:/app:ro
      - ${M2LIVE_STATE:-/var/lib/aiops-m2-live}/node:/home/node
      # 只有公开证书与 truststore：节点不持有任何私钥。
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/tls/public:/etc/m2live-tls:ro
    mem_limit: 500m
    cpus: 0.22
    restart: unless-stopped

  gateway:
    # 隔离 Gateway：**构建好的镜像**，启动不下载、不解析依赖。
    # 镜像身份由 `images.lock.json` 的 `gateway_image` 段钉住，preflight 核对
    # image ID 与内容摘要标签，不认 tag 名。
    image: ${M2LIVE_GATEWAY_IMAGE:?build the gateway image first (build-image.sh)}
    container_name: m2live03-gateway
    networks: [trial, egress, hostloop]
    depends_on:
      platform: {condition: service_started}
    env_file:
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/gateway/gateway.env
    volumes:
      - ${M2LIVE_STATE:-/var/lib/aiops-m2-live}/gateway:/data
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/gateway:/etc/m2live:ro
      # 只读挂载生产配置与 key：既有只读业务依赖从这里读，**不写回**。
      # 源目录由 AIOPS41_CONFIG_DIR 指定（宿主上是 /etc/aiops-41；合成测试可指向替身），
      # 容器内路径固定 —— 网关读的是同一个路径，不因环境而变。
      # 只挂**公开证书**：网关需要验证平台，不需要任何签名能力。
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/tls/public:/etc/m2live-tls:ro
      # 业务依赖：**只读**的受限子集，不是整份生产配置。见 build-runtime-config.sh。
      - ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/gateway/runtime.env:/etc/m2live/runtime.env:ro
      - ${AIOPS41_CONFIG_DIR:-/etc/aiops-41}/keys:/etc/aiops-41/keys:ro
    # 以宿主上的服务用户运行：网关的私有文件检查要求「所有者 == 当前用户」，
    # 用 root 跑会让 /data 的属主对不上而拒绝启动。
    user: "${M2LIVE_UID:-999}:${M2LIVE_GID:-987}"
    working_dir: /opt/aiops-src
    command:
      - sh
      - -c
      - |
        set -e
        # 平台讲 HTTPS，本栈 CA 必须被信任；**同时**不能丢掉系统的公开 CA ——
        # CPMS / UPMS / 模型端点都是公开 CA 签发的。`SSL_CERT_FILE` 是替换而不是追加，
        # 所以这里显式拼一份「系统 bundle + 本栈 CA」再交给 Python。
        # 结果是校验没有被放宽：两套根都在，且主机名仍要匹配。
        cat /etc/ssl/certs/ca-certificates.crt /etc/m2live-tls/ca.crt > /data/ca-bundle.crt
        exec python -m aiops_diagnostics.gateway_server serve
    environment:
      PYTHONPATH: /opt/aiops-src/src
      HOME: /data
      PYTHONUNBUFFERED: "1"
      # —— 隔离门禁（真实启动路径） ——
      M2LIVE_ISOLATION_ROOT: /data
      M2LIVE_EXPECTED_UID: "${M2LIVE_UID:-999}"
      M2LIVE_READONLY_PATHS: /etc/m2live/runtime.env:/etc/aiops-41/keys:/etc/m2live:/etc/m2live-tls
      # 信任库由启动脚本拼成（系统 bundle + 本栈 CA）。设成**容器环境变量**而不是只在
      # command 里 export：`docker exec` 起的探针进程也要看到同一个信任库，否则
      # 「容器能连平台、探针连不上」会变成一个解释不清的差异。
      SSL_CERT_FILE: /data/ca-bundle.crt
      # 生产会话库在宿主回环 6379；生产配置里写的是 127.0.0.1，容器里那是自己。
      # 这里只改**本栈容器**的解析目标，宿主与生产的 Redis 监听不变。
      AIOPS_REDIS_HOST: gateway-host-relay
      AIOPS_REDIS_PORT: "6379"
    mem_limit: 400m
    cpus: 0.22
    ports:
      - 127.0.0.1:8794:8794
    restart: unless-stopped

secrets:
  mysql_root:
    file: ${M2LIVE_CONFIG:-/etc/aiops-m2-live}/secrets/mysql_root
