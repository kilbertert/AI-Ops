name: Runner Probe

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'queue:probe' &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - name: Occupy the agent slot without a model or production access
        env:
          RUNNER_ID: ${{ runner.name }}
        run: |
          echo "agent=$RUNNER_ID started=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          sleep 90
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'queue:probe' &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: aiops-deploy
    timeout-minutes: 4
    steps:
      - name: Probe the dedicated deployment slot
        env:
          RUNNER_ID: ${{ runner.name }}
        run: |
          echo "deploy=$RUNNER_ID started=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          command -v dev-host
          command -v dev-changelog
