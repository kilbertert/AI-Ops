name: Release Dify Edge OCI Image

# 当 main 分支的 Dify 36 侧边车（console-bridge / login-proxy / 边缘配置）变更或手动触发时，
# 构建并推送单一只读 @sha256 aiops-dify-edge 镜像至公司阿里云 ACR。

on:
  push:
    branches:
      - main
    paths:
      - "deploy/dify-36/edge/**"
      - "services/dify-console-bridge/**"
      - "services/dify-login-proxy/**"
      - "src/aiops_diagnostics/__init__.py"
      - "src/aiops_diagnostics/common/**"
      - "src/aiops_diagnostics/dify/**"
      - "src/aiops_diagnostics/gateway/**"
      - "src/aiops_diagnostics/identity/**"
      - "src/aiops_diagnostics/onboarding/**"
      - "ops/dify-login-proxy/dify-login-page.html"
      - "ops/dify-console-bridge/dify-console-10008.conf"
      - "ops/dify-console-bridge/dify-console-publish.conf"
      - "ops/dify-login-proxy/dify-login-proxy.conf"
      - ".github/workflows/release-dify-edge-image.yml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "main 上用于构建 Dify Edge 镜像的分支或提交 SHA（默认 main）"
        required: false
        default: "main"
        type: string
      release_tag:
        description: "可选：附带打标并上传 dify-edge-image.json 到指定 GitHub Release（例如 v1.43.23）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: dify-edge-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-dify-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build, verify, and publish Dify Edge OCI image to ACR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.event.inputs.target_ref || 'HEAD' }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          AIOPS_DIFY_EDGE_IMAGE_REPO: ${{ vars.AIOPS_DIFY_EDGE_IMAGE_REPO }}
          AIOPS_ACR_USERNAME: ${{ secrets.AIOPS_ACR_USERNAME }}
          AIOPS_ACR_PASSWORD: ${{ secrets.AIOPS_ACR_PASSWORD }}
        run: |
          args=(--ref "$TARGET_REF" --output-metadata "$RUNNER_TEMP/dify-edge-image.json" --allow-skip-unconfigured)
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--tag "$RELEASE_TAG" --upload-release "$RELEASE_TAG")
          fi
          bash deploy/dify-36/edge/publish-edge-image.sh "${args[@]}"

      - name: Upload Dify Edge image metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dify-edge-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dify-edge-image.json
          if-no-files-found: ignore
          retention-days: 30
