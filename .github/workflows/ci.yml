name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # GitHub-hosted, NOT self-hosted. The self-hosted runner was chosen while
    # GitHub-hosted minutes for this repository were exhausted, and it was
    # paired with a fork gate because a persistent runner must never execute
    # untrusted pull-request code. The repository is public now, so standard
    # GitHub-hosted runners cost nothing and the gate can go: GitHub counts a
    # skipped required job as a success, so a gated job silently satisfies the
    # branch Ruleset for every fork pull request.
    #
    # The agent-*.yml and architecture-review.yml workflows stay on the
    # self-hosted runner: they need its persistent filesystem, AGENT_PAT and the
    # controller/candidate/delivery isolation, and .sandcastle/policy-check.mjs
    # statically locks their owner-only same-repository gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Check imports and dependencies
        run: |
          uv run python -m compileall -q src tests
          uv pip check

  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Windows verification
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          uv run python -m compileall -q src tests
          uv pip check

      - name: Build and smoke-test Windows portable bundle
        run: uv run python packaging/build_portable.py
