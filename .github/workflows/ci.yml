name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 🔴 **2026-10-12: back on the self-hosted runner, and that re-opens a gate.**
    #
    # This job was moved to `ubuntu-latest` with the argument above: a public
    # repository's GitHub-hosted minutes are free, so the fork gate that a
    # persistent runner needs could be retired. It is back on the persistent
    # runner because **the account is currently locked for billing** ("The job
    # was not started because your account is locked due to a billing issue") —
    # every pull request's required checks refused to start, which blocks the
    # default branch for *all* work, not just for forks.
    #
    # ⚠️ **What came back with it**: a persistent runner executes whatever the
    # pull request contains. `add a fork guard` is only safe while this job is
    # hosted; on `self-hosted` the protection is the repository's own boundary,
    # measured (not assumed) on the day of the switch: `forks_count = 0`, and
    # every pull request in the repository's history comes from the owner.
    # **Re-measure before trusting it**, and move back to `ubuntu-latest` as
    # soon as the account can start hosted jobs again:
    #
    #   gh api repos/kilbertert/AI-Ops --jq .forks_count
    #   gh run list --workflow=ci.yml --limit 1 --json conclusion
    #
    # The agent-*.yml and architecture-review.yml workflows were never moved:
    # they need the persistent filesystem, AGENT_PAT and the
    # controller/candidate/delivery isolation, and .sandcastle/policy-check.mjs
    # statically locks their owner-only same-repository gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 🔴 `enable-cache: false` **because the runner is persistent** (#711).
      #
      # The action's post step prunes its cache directory, and on this host that
      # prune hung the whole job: every real step (deps, lint, the full suite,
      # compileall, `uv pip check`) had already finished green, then the job sat
      # 5 minutes and failed on "Post Install uv" — the run reported **failure**
      # for a suite that passed. (`package.yml` keeps `enable-cache: true`; it
      # only runs on `v*` tags and manual dispatch, so a post-step hang there
      # cannot close a required check.)
      #
      # The cache is not worth that risk here: it points at `/home/claude/.cache/uv`,
      # which is a development-host cache with no run-to-run benefit on
      # `ubuntu-latest` — where this job lived until the account's billing lock
      # forced it back. If caching is wanted back, give it a
      # `${{ runner.temp }}`-scoped directory **and** verify the post step
      # completes before trusting it.
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        # 并行，但 **xdist 不进 pyproject.toml**（见 ADR 0038）：加一个 dev 依赖会改
        # uv.lock，而 deploy-41.sh 的依赖漂移门拿 uv.lock 的 sha256 与 41 上的比，
        # 于是"加一个测试依赖"会拦住整条 CD，直到人工更新 41 的环境。
        # `--with` 只装进 uv 的临时覆盖环境，lockfile 与 pyproject 都不动。
        #
        # ⚠️ 确定性边界（诚实记录，见 ADR 0038）：`--with` 的解析**不在 uv.lock 里**，
        # 所以这不是"逐字节可复现"。锁定的是**直接依赖**（xdist 与 execnet 都写死版本，
        # `pytest` 由下面 `uv sync --locked` 提供），但 `execnet` 的元数据若日后变化，
        # 解析结果仍可能与今天不同。判据是：**测试集合（2738 passed / 9 skipped）
        # 不随并行度变化**——实测 -n 2/4/6/8/auto 与串行逐字相同。
        # 若想连解析也钉死，唯一办法是把 xdist 写进 lockfile，那要连带一次 41 的
        # 环境更新，代价见 ADR 0038。
        run: uv run --with pytest-xdist==3.8.0 --with execnet==2.1.2 pytest -q -n auto

      - name: Check imports and dependencies
        run: |
          uv run python -m compileall -q src tests
          uv pip check
