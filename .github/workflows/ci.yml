name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted, NOT ubuntu-latest: the GitHub-hosted minutes for this
    # repository were exhausted, which stopped every job from starting at all
    # ("recent account payments have failed or your spending limit needs to be
    # increased"). The repository's own runner is online and unlimited, and the
    # other workflows already use it.
    #
    # SECURITY BOUNDARY: self-hosted runners must never run untrusted code.
    # This job runs pull-request code with repository secrets and a persistent
    # filesystem, so it is only safe while every PR author is trusted and fork
    # PRs never reach it. If this repository ever accepts outside
    # contributions, this job must go back to a GitHub-hosted runner and the
    # fork gate below is not sufficient on its own.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          # Cache save is disabled on the self-hosted runner. Its post-job step
          # runs `uv cache prune` against the SAME uv cache this host's
          # development work uses (~/.cache/uv, ~900M, concurrently held by live
          # processes), so the step contends, hangs for its full timeout, and
          # then fails the job. Worse than slow, it is destructive: a CI job
          # pruning the developer's cache is not something to leave armed.
          #
          # No speed is lost: `uv sync` below still reads that local cache
          # directly (the install step measured ~11s), and the action's own
          # cache is only a GitHub-side copy we do not need here.
          enable-cache: false
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Check imports and dependencies
        run: |
          uv run python -m compileall -q src tests
          uv pip check

  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Windows verification
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          uv run python -m compileall -q src tests
          uv pip check

      - name: Build and smoke-test Windows portable bundle
        run: uv run python packaging/build_portable.py
