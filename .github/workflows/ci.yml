name: CI

# `pull_request` only — deliberately NOT `push: main`.
#
# On `push: main` this job re-ran content CI had already verified on the pull
# request, and the content is provably the same: a squash merge (this repository's
# rule) produces a commit whose tree is byte-identical to the PR head's. Measured
# 2026-10-18 on #828: `6684b5f6^{tree}` (PR head) and `89c2612e^{tree}` (merge)
# are both `9e754088`. So the second run tested the same bytes twice.
#
# What the second run was buying — "the gate re-stands on the protected branch" —
# is already bought by the ruleset: `main` requires the `verify` and
# `Workflow policy` checks and forbids non-fast-forward pushes, so nothing reaches
# `main` except through a pull request that passed them. That is the same premise
# `cd.yml` already relies on; its own comment says it does not repeat the checks
# "because main can only be entered through a PR carrying the required checks".
#
# This is NOT the same trade as skipping CI for docs-only changes, which was
# measured and rejected: `tests/test_readme_architecture.py` asserts against
# `README.md`, so a path filter would let a documentation edit bypass a test that
# reads it.

on:
  # ⚠️ Activity types are listed EXPLICITLY, and `ready_for_review` is among them.
  # GitHub's default set is `opened, synchronize, reopened` — and a job skipped
  # because the PR was a draft records a `skipped` conclusion, which SATISFIES a
  # required status check. So a draft that is marked ready without another push
  # would never run this job and could still merge, unverified. Listing
  # `ready_for_review` is what closes that hole; the job-level guard below is what
  # keeps it from running during draft edits.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ── Do not run while the pull request is a draft ────────────────────────────
    # A draft is the platform's own word for "not ready to be judged", and this
    # repository already uses it: `agent-implement.yml` and `agent-implement-prd.yml`
    # open delivery PRs with `gh pr create --draft`.
    #
    # Why this is not just tidiness. Measured 2026-10-18: one AFK pull request
    # (#825) ran this workflow 11 times — 8 successes plus 3 cancelled — about 16
    # minutes of runner time. Nothing consumed a single one of those results:
    # `grep -rn 'gh pr checks|statusCheckRollup|/check-runs' .sandcastle/ .github/`
    # returns nothing, so no agent, review pass, or workflow reads a PR's CI
    # conclusion. The agent verifies locally instead — `.sandcastle/implement.md`
    # step 3 tells it to run the project's own check before committing.
    #
    # The rule this encodes: a CI run is worth its cost only when it (a) covers the
    # content that is about to enter main AND (b) its result is used. A draft fails
    # both.
    #
    # ⚠️ `ready_for_review` MUST be exempted, and that is not a detail. Measured on
    # this repository (PR #833): when a draft is marked ready, the `ready_for_review`
    # event fires, but its `pull_request.draft` field still reads `true` — the
    # payload describes the transition, not the state after it. A guard that only
    # tested `draft` therefore skipped the run for the one event that means "now
    # judge it", and the PR ended with all three checks `skipping` and no way to
    # revisit them. The exemption is what makes the guard correct rather than
    # merely quiet.
    #
    # ⚠️ Written as a guard rather than as a `types: [...]` filter on purpose.
    # `types: [ready_for_review]` alone would mean a NON-draft pull request never
    # runs at all — it is already ready when `opened` fires. Keeping the trigger
    # broad and the condition explicit is what makes "will this run?" readable from
    # the file; a filter that silently drops events is the failure ADR 0010 and the
    # 1.7.26 work both exist to prevent.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    # 🔴 **2026-10-12: back on the self-hosted runner, and that re-opens a gate.**
    #
    # This job was moved to `ubuntu-latest` with the argument above: a public
    # repository's GitHub-hosted minutes are free, so the fork gate that a
    # persistent runner needs could be retired. It is back on the persistent
    # runner because **the account is currently locked for billing** ("The job
    # was not started because your account is locked due to a billing issue") —
    # every pull request's required checks refused to start, which blocks the
    # default branch for *all* work, not just for forks.
    #
    # ⚠️ **What came back with it**: a persistent runner executes whatever the
    # pull request contains. `add a fork guard` is only safe while this job is
    # hosted; on `self-hosted` the protection is the repository's own boundary,
    # measured (not assumed) on the day of the switch: `forks_count = 0`, and
    # every pull request in the repository's history comes from the owner.
    # **Re-measure before trusting it**, and move back to `ubuntu-latest` as
    # soon as the account can start hosted jobs again:
    #
    #   gh api repos/kilbertert/AI-Ops --jq .forks_count
    #   gh run list --workflow=ci.yml --limit 1 --json conclusion
    #
    # The agent-*.yml and architecture-review.yml workflows were never moved:
    # they need the persistent filesystem, AGENT_PAT and the
    # controller/candidate/delivery isolation, and .sandcastle/policy-check.mjs
    # statically locks their owner-only same-repository gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 🔴 `enable-cache: false` **because the runner is persistent** (#711).
      #
      # The action's post step prunes its cache directory, and on this host that
      # prune hung the whole job: every real step (deps, lint, the full suite,
      # compileall, `uv pip check`) had already finished green, then the job sat
      # 5 minutes and failed on "Post Install uv" — the run reported **failure**
      # for a suite that passed. (`package.yml` keeps `enable-cache: true`; it
      # only runs on `v*` tags and manual dispatch, so a post-step hang there
      # cannot close a required check.)
      #
      # The cache is not worth that risk here: it points at `/home/claude/.cache/uv`,
      # which is a development-host cache with no run-to-run benefit on
      # `ubuntu-latest` — where this job lived until the account's billing lock
      # forced it back. If caching is wanted back, give it a
      # `${{ runner.temp }}`-scoped directory **and** verify the post step
      # completes before trusting it.
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Install locked dependencies
        # `--inexact` 允许 venv 里存在 lockfile 之外的东西，供下一步装并行调度器。
        # 不加它，下一步 `uv run` 的隐式同步会把刚装上的 xdist 删掉
        # （实测：`uv sync --locked --dev` 之后 `import xdist` → ModuleNotFoundError）。
        run: uv sync --locked --inexact --dev

      - name: Run static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # No scheduler install step. `pytest-xdist` is a declared dev dependency as of
      # 2026-10-23, so `uv sync --locked --inexact --dev` above provides it, and
      # `-n auto` lives in `pyproject.toml`'s addopts. It used to be installed here
      # ad hoc — which meant CI had it and every other venv did not, so a fresh
      # worktree ran serial (279 s vs 55 s) without saying so.

      - name: Run tests
        # 绿之外还要有量。三件事可能让这一步"绿得没有意义"：
        #   1. 收集为空（import 错误吞掉整个目录）——pytest 会以 0 退出；
        #   2. xdist worker 崩掉，它那份没跑；
        #   3. 测试静默变成 skip —— **记成 pass 的 skip 是假绿**（本机另一仓
        #      health-flow 的 CI 注释专门写过这个形状：`445 passed, 4 skipped` 被读成通过）。
        #
        # 基线：**CI 上 2740 passed / 10 skipped**。
        # ⚠️ 比本机多一条跳过，不是异常：`test_cd_deploy_scripts.py` 的 dry-run
        # 需要 `dev-host`，而那东西只在开发机上 —— CI 是 GitHub-hosted，所以它跳过。
        # 本机是 2741 / 9，差的就是这一条。（这个基线差异是本步骤第一版没料到的：
        # 当时写死 `<= 9`，CI 立刻红，失败信息就是下面那句。是 `-rs` 打印的原因
        # 让"多出来的这一条是有意的"一眼可判——换成一个只有计数的断言，这里就得靠猜。）
        # 用上限而非等号：新增测试不会让这条腐化。
        run: |
          set -eo pipefail
          # ⚠️ **不要再加 `-q`**：`pyproject.toml` 的 addopts 已经是 `-q`，再加一个
          # 就是 `-qq`，而 `-qq` 会把那句 "N passed, M skipped" 汇总行**整个吞掉**。
          # （这正是本步骤第一版的 bug：grep 汇总行永远匹配不到，于是"跳过数=0"
          # 读成一个通过的空集合。上一次 PR 里 CI 日志没有汇总行、只能靠数进度点
          # 才知道跑了多少测试，根因就是它。）
          uv run pytest -rs | tee /tmp/pytest.log
          # ⚠️ `-rs` 会把逐条跳过原因排在**最后**，所以汇总行在它**上面**。
          # 用 `tail -1` 取会拿到一条 SKIPPED 明细，`[0-9]+ skipped` 便永远匹配不到
          # 而回退成 0（这个 bug 在本步骤的第一版里真实存在，靠跑一遍才发现）。
          summary=$(grep -E "[0-9]+ passed" /tmp/pytest.log | tail -1)
          [ -n "$summary" ] || {
            echo "::error::输出里没有 'N passed' 汇总行 —— 收集或执行没有真的发生"; exit 1; }
          total=$(printf '%s' "$summary" | grep -oE "^[0-9]+")
          skipped=$(printf '%s' "$summary" | grep -oE "[0-9]+ skipped" | grep -oE "[0-9]+" || echo 0)
          echo "汇总：passed=$total skipped=$skipped"
          [ "$total" -ge 2700 ] || {
            echo "::error::只跑了 $total 个测试（基线约 2740）—— 有测试没被收集"; exit 1; }
          [ "$skipped" -le 10 ] || {
            echo "::error::跳过数 $skipped 超过 CI 基线 10 —— 看上面 -rs 的原因列表，"
            echo "::error::确认多出来的是有意的环境跳过，而不是测试在悄悄跳过"; exit 1; }

      - name: Check imports and dependencies
        run: |
          uv run python -m compileall -q src tests
          uv pip check
