name: CI

# PR 的确定性代码检查；必需检查名 verify 保持稳定。设计与排障见 docs/agents/actions-delivery.md。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # 两点 diff 刻意保守：base 前进时，额外代码差异也走全量。
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Decide the test tier
        id: tier
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          base="$PR_BASE"
          head="$PR_HEAD"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "没有 PR base/head —— 跑全量"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          [ -n "$changed" ] || { echo "tier=full" >> "$GITHUB_OUTPUT"; echo "diff 为空 —— 跑全量"; exit 0; }
          echo "本次改动的文件："
          printf '%s\n' "$changed" | sed 's/^/  /'
          off_docs=$(printf '%s\n' "$changed" | grep -vE '^docs/.*\.md$|^[^/]+\.md$' || true)
          if [ -n "$off_docs" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "白名单之外有改动 ⇒ 全量："
            printf '%s\n' "$off_docs" | sed 's/^/  /'
          else
            echo "tier=docs" >> "$GITHUB_OUTPUT"
            echo "改动全在文档 —— 只跑读文档的那批"
          fi

      - name: Run tests
        id: tests
        env:
          TEST_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          set -eo pipefail
          tier="$TEST_TIER"
          if [ "$tier" = "docs" ]; then
            targets=$(grep -rlE 'docs/|"docs" */|README\.md|qa-plan\.md|acceptance\.feature|SOP\.md|GLOSSARY\.md' \
              tests --include='*.py' | grep -E '(^|/)test_.*\.py$' | sort | tr '\n' ' ' || true)
            echo "文档档：$(printf '%s' "$targets" | wc -w) 个文件"
            if [ -z "${targets// /}" ]; then
              echo "::warning::文档档没算出任何文件 —— 退回全量，避免收集为空"
              targets=""; floor=4000; tier=full
            else
              floor=400
            fi
          else
            targets=""
            floor=4000
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ci-results"
          # pytest 的失败退出码由 pipefail 保留；XML 只负责结果计数与摘要。
          # targets 是仓库测试路径列表，有意按空格分词。
          # shellcheck disable=SC2086
          uv run pytest -rs --junitxml="$RUNNER_TEMP/ci-results/pytest.xml" $targets | tee "$RUNNER_TEMP/ci-results/pytest.log"
          uv run python tools/verification/ci_results.py "$RUNNER_TEMP/ci-results/pytest.xml" --floor "$floor" --tier "$tier"

      - name: Check imports and dependencies
        run: |
          uv run python -m compileall -q src tests
          uv pip check

      - name: Build wheel and sdist
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Build and inspect Gateway image
        if: steps.tests.outputs.tier != 'docs'
        run: |
          base=$(python -c 'import json; print(json.load(open("deploy/m2-live-03/images.lock.json"))["gateway_image"]["base_digest"])')
          docker pull "$base"
          M2LIVE_GATEWAY_IMAGE=aiops-gateway:ci M2LIVE_DIST="$RUNNER_TEMP/ci-results" deploy/m2-live-03/build-image.sh
          docker run --rm --network none --read-only --entrypoint python aiops-gateway:ci \
            -c 'from aiops_diagnostics.gateway.gateway_api import create_gateway_app; print("Gateway import: passed")'

      - name: Summarize CI
        if: always()
        env:
          RESULT: ${{ job.status }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          TEST_TIER: ${{ steps.tests.outputs.tier || steps.tier.outputs.tier }}
        run: |
          {
            echo '### 代码检查（verify）'
            echo "- 结果：$RESULT；测试：$TEST_RESULT；分档：${TEST_TIER:-未判定}"
            echo "- 被验证的合并提交：$GITHUB_SHA"
            echo '- 失败时先看首个失败步骤；测试日志/XML 见 ci-results 制品。'
            echo '- 本检查不代表已部署或已完成业务验收。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test evidence
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: warn
          retention-days: 7
