name: Spec Tree

# 规格树锚点漂移校验：由 kilbertert/fleet-kit@v1 统一提供零拷贝实现。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: spec-tree-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: kilbertert/fleet-kit/.github/workflows/spec-tree.yml@v1
