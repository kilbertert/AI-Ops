name: Spec Tree

# 规格树的辅助检查；不是 Ruleset 必需检查，因此保留 main 上的漂移检查。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-tree-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    name: spec-tree lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install the pinned spec CLI
        run: npm install --global spexcode@0.7.0

      - name: Lint the spec tree
        run: spex spec lint
