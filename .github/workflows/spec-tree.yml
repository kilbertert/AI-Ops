name: Spec Tree

# The `.spec/` tree is project source, and its drift rule is computed from git
# history on every read. Two consequences decide this workflow's shape:
#
#   * `fetch-depth: 0` is REQUIRED, not an optimisation. Measured on a real
#     depth-1 clone: lint reported `0 error 0 warning` after an anchored unit had
#     been modified. A check that passes when it should fail is worse than no
#     check at all.
#   * the version is PINNED. The tree format is committed to this repository, so
#     an unpinned CLI could change the format underneath it.
#
# Deliberately on `ubuntu-latest` and not `self-hosted`: this job needs nothing
# but a checkout and node, and the repository's own `ci.yml` records that a
# persistent runner executes whatever a pull request contains. A read-only
# checker gains nothing from that exposure.

# `pull_request` AND `push: main` — deliberately unlike `ci.yml` and
# `afk-policy.yml`, which dropped the main trigger.
#
# The difference is whether a failure BLOCKS the merge. `verify` and
# `Workflow policy` are required checks, so a failing one cannot enter `main`, and
# re-running them after a squash merge tests a byte-identical tree for no signal.
# This job is NOT a required check — `docs/adr/0032` records that as the current
# state ("spec-tree 作业目前不是必需检查… 今天它会在 PR 上变红但不阻断合并").
# So a spec drift can merge, and before this change the `push: main` run was the
# only place it surfaced afterwards. Dropping it would have turned a known
# unchecked condition into a silent one — found by review, not by the smoke run.
#
# Removing this trigger becomes correct only together with making the check
# required (or with data that its false-positive rate makes it unusable, per ADR
# 0032). That is an independent decision, so this file keeps both triggers.
on:
  # ⚠️ Activity types are listed EXPLICITLY, and `ready_for_review` is among them.
  # GitHub's default set is `opened, synchronize, reopened` — and a job skipped
  # because the PR was a draft records a `skipped` conclusion, which SATISFIES a
  # required status check. So a draft that is marked ready without another push
  # would never run this job and could still merge, unverified. Listing
  # `ready_for_review` is what closes that hole; the job-level guard below is what
  # keeps it from running during draft edits.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-tree-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # ── Do not run while the pull request is a draft ────────────────────────────
    # A draft is the platform's own word for "not ready to be judged", and this
    # repository already uses it: `agent-implement.yml` and `agent-implement-prd.yml`
    # open delivery PRs with `gh pr create --draft`.
    #
    # Why this is not just tidiness. Measured 2026-10-18: one AFK pull request
    # (#825) ran this workflow 11 times — 8 successes plus 3 cancelled — about 16
    # minutes of runner time. Nothing consumed a single one of those results:
    # `grep -rn 'gh pr checks|statusCheckRollup|/check-runs' .sandcastle/ .github/`
    # returns nothing, so no agent, review pass, or workflow reads a PR's CI
    # conclusion. The agent verifies locally instead — `.sandcastle/implement.md`
    # step 3 tells it to run the project's own check before committing.
    #
    # The rule this encodes: a CI run is worth its cost only when it (a) covers the
    # content that is about to enter main AND (b) its result is used. A draft fails
    # both.
    #
    # ⚠️ `ready_for_review` MUST be exempted, and that is not a detail. Measured on
    # this repository (PR #833): when a draft is marked ready, the `ready_for_review`
    # event fires, but its `pull_request.draft` field still reads `true` — the
    # payload describes the transition, not the state after it. A guard that only
    # tested `draft` therefore skipped the run for the one event that means "now
    # judge it", and the PR ended with all three checks `skipping` and no way to
    # revisit them. The exemption is what makes the guard correct rather than
    # merely quiet.
    #
    # ⚠️ Written as a guard rather than as a `types: [...]` filter on purpose.
    # `types: [ready_for_review]` alone would mean a NON-draft pull request never
    # runs at all — it is already ready when `opened` fires. Keeping the trigger
    # broad and the condition explicit is what makes "will this run?" readable from
    # the file; a filter that silently drops events is the failure ADR 0010 and the
    # 1.7.26 work both exist to prevent.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    name: spec-tree lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install the pinned spec CLI
        run: npm install --global spexcode@0.7.0

      - name: Lint the spec tree
        run: spex spec lint
