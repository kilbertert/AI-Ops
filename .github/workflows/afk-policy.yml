name: AFK Policy

# PR 确定性交付与 ADR 边界门禁：零拷贝调用 kilbertert/fleet-kit/actions/policy-gate@v1。
# 通过 Composite Action 保持 GitHub Ruleset 必需检查名 `Workflow policy` 零中断。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run fleet-kit policy gate
        uses: kilbertert/fleet-kit/actions/policy-gate@v1
        with:
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
