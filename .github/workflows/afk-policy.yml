name: AFK Policy

# PR 的交付与 AFK 边界检查；必需检查名 Workflow policy 保持稳定。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify AFK workflow boundaries
        run: node .sandcastle/policy-check.mjs workflows
      - name: Verify reviewer verdict and execution boundary
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx .sandcastle/review-boundary.check.ts
      - name: Verify runner cancellation signal
        run: npx --no-install tsx .sandcastle/queue/cancellation.check.ts
      - name: Verify sandbox network isolation
        run: npx --no-install tsx .sandcastle/profile-network.check.ts
      - name: Verify sandbox MCP config
        run: npx --no-install tsx .sandcastle/mcp-config.check.ts
      - name: Verify the sandbox image wiring
        run: npx --no-install tsx .sandcastle/profile-image.check.ts
      - name: Verify the console heartbeat filter
        run: npx --no-install tsx .sandcastle/quiet-heartbeats.check.ts
      - name: Verify the repository map is current
        run: node .sandcastle/repo-map.check.mjs
      - name: Verify the sandbox prepare hook
        run: npx --no-install tsx .sandcastle/sandbox-prepare.check.ts
      - name: Verify decision records
        env:
          AFK_ADR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .sandcastle/adr.check.mjs --base "$AFK_ADR_BASE"
      - name: Note where the changelog check runs
        run: |
          echo "CHANGELOG.md is verified by dev-policy-audit on the development host;"
          echo "this job has neither dev-changelog nor git-cliff, so it cannot check it."
      - name: Repository-map generator self-check
        run: node .sandcastle/repo-map.mjs --self-check
      - name: Conflict-surface table self-check
        run: node .sandcastle/conflict-surface.mjs --self-check
      - name: Conflict surface has no structural regression
        run: node .sandcastle/conflict-surface.mjs --check

      - name: Summarize policy
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo '### 交付检查（Workflow policy）'
            echo "- 结果：$RESULT"
            echo '- 本检查覆盖 AFK 隔离、工具自检与 ADR，不是模型审查。'
            echo '- ADR 失败：先查看重复编号、缺失记录或提交中的 No-ADR 说明。'
            echo '- 操作入口见 docs/agents/actions-delivery.md。'
          } >> "$GITHUB_STEP_SUMMARY"
