name: CD Watch

# #407：让「CD 未按预期发生」可见，**不改批准门本身**。
#
# 起因：连续 6 次 src 合并都没成功部署而无人察觉 —— 那段时间有人在手工 rsync，生产确实
# 更新了，于是没有任何理由去看 CD。手工动作把「CD 坏了」这条本应被发现的信号一起抹掉了。
#
# 两条判据（实现见 .sandcastle/deploy-state.mjs）：
#   1. **卡住**：`waiting` 与「根本没在跑」在 API 上长得一样，靠 `pending_deployments`
#      分辨（等批准的有部署记录，死锁的没有）；
#   2. **连续不成功**：判据是「最近 N 次**已完成**的 run 里有没有 success」，
#      而不是「当前这次多久没动静」——后者区分不了「还没来得及」。
#
# 为什么跑在 self-hosted：本 job 只用 `gh` + 仓库自带的 node 脚本，**不跑候选代码、
# 不碰生产**，而 self-hosted runner 上 gh 已认证。放在 GitHub-hosted 上需要额外
# token 配置，收益是零。
#
# 为什么开票而不是让 job 失败：判据是**状态**。job 失败只会让红色出现在一个没人天天看
# 的页面上 —— 那正是本票要修的病。一张未关的 `cd:needs-attention` 票本身就是未处理的告警。

on:
  schedule:
    # 每小时的第 7 分钟。刻意避开 :00 —— 整点是所有人的默认选择，GitHub 在
    # 那些时刻会延迟计划任务（本 job 对分钟数没有要求，避开就没有代价）。
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # 开票与评论需要写权限。范围只到 issue，不涉 contents。
  issues: write

jobs:
  watch:
    runs-on: [self-hosted, AI-Ops]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the watchdog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 只用仓库自带的脚本，不需要历史。
          fetch-depth: 1
          persist-credentials: false

      # 先用真数据跑一次**只读**判定：异常时打印告警内容但不投递。
      # 这一段同时也是「可复跑的检查」—— 任何人在本机跑 `node .sandcastle/cd-watch.mjs
      # --dry-run` 都能回答「此刻是否有待批准的 CD」。
      - name: Assess the CD state (read-only)
        run: node .sandcastle/cd-watch.mjs --dry-run

      # 判定自检：用票里记录的真实形态（含 jobs=0 的死锁）驱动全部分支。
      # 放在投递之前 —— 判定坏了就不该投递。
      - name: Self-check the decision logic
        run: |
          node .sandcastle/deploy-state.mjs
          node .sandcastle/cd-watch.test.mjs

      - name: Raise or update the alarm
        run: node .sandcastle/cd-watch.mjs

      - name: Summarize
        if: always()
        run: |
          {
            echo "### CD Watch"
            echo
            echo "判定逻辑见 \`.sandcastle/deploy-state.mjs\`；阈值：卡住 30 分钟、连续失败 3 次。"
            echo
            echo "**批准门未被改动**：\`production-41\` 的 \`required_reviewers\` 保留。"
            echo "卡住时谁负责批准、怎么办，见 \`docs/agents/env-41-runbook.md\` 的 CD 一节。"
          } >> "$GITHUB_STEP_SUMMARY"
