name: Doc Lifecycle

# 文档自动减债闭环（Doc-GC，ADR-0371）：由 kilbertert/fleet-kit@v1 统一提供零拷贝实现。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  pr-check:
    concurrency:
      group: doc-lifecycle-pr-${{ github.ref }}
      cancel-in-progress: true
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'ready_for_review' || github.event.pull_request.draft == false)
    permissions:
      contents: read
    uses: kilbertert/fleet-kit/.github/workflows/doc-lifecycle-pr.yml@v1

  autovacuum:
    # 定时和手动巡检写同一张仓库台账，必须共用队列。
    concurrency:
      group: doc-lifecycle-maintenance-ledger
      cancel-in-progress: false
      queue: max
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: kilbertert/fleet-kit/.github/workflows/doc-lifecycle-audit.yml@v1
