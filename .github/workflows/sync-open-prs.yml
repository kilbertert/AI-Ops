name: Sync Open PRs

# main 与定时事件只报告状态；手动指定一个 PR 才更新，不改写提交历史。
# 这不是合并队列：严格 base 检查、人工 review 和 Ruleset 继续决定是否可合并。
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "明确要同步 main 的 PR 编号（不会合并 PR）"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-open-prs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse to run without a token that can trigger workflows
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'AGENT_PAT is required; GITHUB_TOKEN cannot trigger downstream CI' >&2
            exit 1
          fi

      - name: Update one delivery candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'PR 编号必须是正整数' >&2; exit 1; }
          fields=number,state,baseRefName,isDraft,mergeStateStatus,author,isCrossRepository,assignees,labels,headRefOid
          current=$(gh pr view "$PR_NUMBER" --json "$fields")
          # $owner 是 jq 参数，不由 shell 展开。
          # shellcheck disable=SC2016
          eligible='.state == "OPEN" and .baseRefName == "main" and .isDraft == false
            and .author.login == $owner and .isCrossRepository == false
            and (.assignees | length == 0)
            and all(.labels[]; .name != "agent:in-progress" and .name != "agent:update-branch" and .name != "agent:blocked")
            and .mergeStateStatus == "BEHIND"'
          if ! jq -e --arg owner "$REPOSITORY_OWNER" "$eligible" <<<"$current" >/dev/null; then
            echo "#$PR_NUMBER 不满足同步条件；状态、占用或冲突需由原作者处理。" >&2
            exit 1
          fi
          # expected_head_sha 防止覆盖读取之后作者刚推送的新提交。
          head=$(jq -r '.headRefOid' <<<"$current")
          gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$head"
          echo "已请求将 main 合入 #$PR_NUMBER；保留历史，等待新提交的必需 CI。" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise what is still blocked
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --base main --state open --limit 100 \
            --json number,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft == false) | "#\(.number): \(.mergeStateStatus)"' \
            >> "$GITHUB_STEP_SUMMARY"
