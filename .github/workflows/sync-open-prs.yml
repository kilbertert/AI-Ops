name: Sync Open PRs

# Keeps every open pull request from stalling on "update branch", and hands a real
# conflict to the agent that already knows how to fix one.
#
# Why this exists (measured 2026-10-23): `main` took 32 merges in one day. Branch
# protection is strict (`strict_required_status_checks_policy: true`), so every
# merge leaves every other open PR BEHIND. And GitHub does not dispatch
# `pull_request` workflows at all for a PR that has a merge conflict — the PR shows
# DIRTY and CI looks "slow" when it never started (measured on #643: zero `CI` runs).
#
# The fix for the conflict *source* is the split into per-entry documents
# (`AGENTS.md`); this workflow only handles what is left: a PR that is merely
# behind, and a PR that genuinely conflicts.
#
# ⚠️ Do not reimplement conflict resolution here. `agent-update-branch.yml` already
# does it with a real trust boundary — trusted controller checked out separately
# from the candidate, a read-only token for the candidate, `AGENT_PAT` only for the
# final push, and a policy check on the result. A second, simpler merge path would
# be a second place to be wrong, and the simpler one is the one that would drift.
# This workflow's whole job is to decide *which* PRs get that treatment.
#
# ⚠️ Runs on GitHub-hosted, not self-hosted, for the same reason `cd-watch.yml`
# does: a watcher sharing a machine with what it watches goes quiet exactly when
# that machine breaks. It runs `gh` only — no candidate code, no production.

on:
  push:
    branches: [main]
  schedule:
    # Once a day, so a PR that fell behind while no one was merging is not
    # stranded until the next merge. Off the hour to avoid the runner stampede.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A push to main and the daily tick can overlap; both enumerate PRs from scratch,
  # so the older run adds nothing. Serialize rather than cancel: a cancelled run
  # could stop between "labelled" and "reported".
  group: sync-open-prs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      # A label applied with `GITHUB_TOKEN` does NOT trigger the workflow that
      # listens for it — `agent-promote-queued.yml` hit exactly this and had to
      # use AGENT_PAT for the same reason. Without this token the DIRTY half of
      # this workflow silently does nothing.
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
    steps:
      - name: Refuse to run without a token that can trigger workflows
        env:
          TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AGENT_PAT is required: a GITHUB_TOKEN label cannot trigger agent-update-branch.yml" >&2
            exit 1
          fi

      - name: Update behind and conflicting pull requests
        run: |
          set -euo pipefail

          # mergeStateStatus is computed lazily; right after a push it reads
          # UNKNOWN for a few seconds. Wait rather than misclassify a PR as
          # neither-behind-nor-conflicting.
          for attempt in 1 2 3 4 5 6; do
            rows=$(gh pr list --base main --state open --limit 100 \
              --json number,isDraft,mergeStateStatus,autoMergeRequest)
            if ! jq -e 'any(.[]; .mergeStateStatus == "UNKNOWN")' <<<"$rows" >/dev/null; then
              break
            fi
            echo "mergeability still UNKNOWN (attempt $attempt); waiting"
            sleep 10
            if [ "$attempt" = 6 ]; then
              echo "::warning::some PRs still report UNKNOWN; they are skipped this run"
            fi
          done

          # Drafts are excluded on purpose: a draft's conflicts block nobody, and
          # an agent run against a half-finished branch is pure waste.
          #
          # One line per PR, not a space-separated word list: an empty result must
          # produce zero iterations. `for number in $empty` happens to work, but
          # `<<<"$empty"` inside the loop body reads nothing and `grep` then blocks
          # on stdin — verified in bash. Read with `while read` so an empty list is
          # simply no lines.
          behind=$(jq -r '.[] | select(.isDraft == false and .mergeStateStatus == "BEHIND") | .number' <<<"$rows")
          dirty=$(jq -r '.[] | select(.isDraft == false and .mergeStateStatus == "DIRTY") | .number' <<<"$rows")

          echo "behind: $(tr '\n' ' ' <<<"$behind" | sed 's/^ *$/<none>/')"
          echo "dirty:  $(tr '\n' ' ' <<<"$dirty"  | sed 's/^ *$/<none>/')"

          while read -r number; do
            [ -n "$number" ] || continue
            # A PR can be simultaneously BEHIND and DIRTY; DIRTY wins, because
            # update-branch cannot resolve a conflict and would just fail.
            if grep -qx "$number" <<<"$dirty"; then
              continue
            fi
            echo "::notice::#${number} is behind — updating branch"
            if ! gh pr update-branch "$number" --rebase; then
              # Not fatal: the PR may have become DIRTY between the listing and
              # this call, or the repository may disallow rebasing. It will be
              # picked up as DIRTY on the next run.
              echo "::warning::#${number} could not be updated in place; leaving it for the next run"
            fi
          done <<<"${behind:-}"

          while read -r number; do
            [ -n "$number" ] || continue
            labels=$(gh pr view "$number" --json labels --jq '[.labels[].name] | join(",")')

            # An agent is already on it: `agent-update-branch.yml` removes the
            # trigger label when it starts, so re-adding it here would suggest a
            # queue that does not exist. `agent:blocked` means the agent already
            # tried and gave up — retrying it unchanged would loop.
            case ",${labels}," in
              *,agent:in-progress,*|*,agent:update-branch,*|*,agent:blocked,*)
                echo "::notice::#${number} already has an agent state (${labels}); leaving it alone"
                continue
                ;;
            esac

            # A PR with an assignee is someone's active work. Rebasing it would
            # rewrite a branch another person is holding, and the repository rule
            # is not to rewrite a published task branch merely to resolve drift.
            assignees=$(gh pr view "$number" --json assignees --jq '.assignees | length')
            if [ "$assignees" != "0" ]; then
              echo "::notice::#${number} is assigned; not touching it"
              continue
            fi

            echo "::notice::#${number} conflicts — handing it to agent-update-branch"
            gh pr edit "$number" --add-label "agent:update-branch"
          done <<<"${dirty:-}"

      - name: Summarise what is still blocked
        if: always()
        run: |
          gh pr list --base main --state open --limit 100 \
            --json number,title,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft == false) | select(.mergeStateStatus == "DIRTY" or .mergeStateStatus == "BLOCKED") | "#\(.number) \(.mergeStateStatus) — \(.title)"' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
