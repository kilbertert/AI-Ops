name: Sync Open PRs

# Open PR 状态汇总与受控单 PR 同步：由 kilbertert/fleet-kit@v1 统一提供零拷贝实现。

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "明确要同步 main 的 PR 编号（不会合并 PR）"
        required: true
        type: number

concurrency:
  group: sync-open-prs
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
      pull-requests: read
    uses: kilbertert/fleet-kit/.github/workflows/sync-open-prs.yml@v1
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
    secrets: inherit
