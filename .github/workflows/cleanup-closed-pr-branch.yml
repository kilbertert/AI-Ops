name: Cleanup Closed PR Branch

# PR 未合入而关闭时安全删除同仓任务分支：由 kilbertert/fleet-kit@v1 统一提供零拷贝实现。

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: cleanup-closed-pr-branch-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: write
      pull-requests: read
    uses: kilbertert/fleet-kit/.github/workflows/cleanup-closed-pr-branch.yml@v1
    with:
      head_ref: ${{ github.event.pull_request.head.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      default_branch: ${{ github.event.repository.default_branch }}
      trigger_gitlab_mirror: true
