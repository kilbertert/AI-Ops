name: Portable Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Linux only. The Windows matrix row was removed with the Windows
  # distribution itself (see docs/validation.md, 2026-09-24): leaving it here
  # would mean a `v*` tag still auto-publishes a Windows bundle for a
  # platform this project no longer ships. Restoring Windows means adding
  # the row back AND restoring the runner-side build and extraction smoke
  # test that used to hold it honest — not just the one line.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Build and smoke-test portable bundle
        run: uv run python packaging/build_portable.py

      - name: Upload portable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aiops-diagnostics-${{ matrix.artifact }}
          path: dist/aiops-diagnostics-*.zip
          if-no-files-found: error
          retention-days: 7
