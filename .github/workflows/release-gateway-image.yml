name: Release Gateway OCI Image (Backfill)

# 手动补发/切仓重推指定官方正式标签（vX.Y.Z）的客户机 Gateway OCI 镜像；日常 CD 由 cd.yml 自动调用同脚本。

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "已发布的 SemVer 注释标签（例如 v1.43.22）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gateway-oci-backfill-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Build, verify, and publish OCI gateway image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag }}
          AIOPS_GATEWAY_IMAGE_REPO: ${{ vars.AIOPS_GATEWAY_IMAGE_REPO }}
          AIOPS_ACR_USERNAME: ${{ secrets.AIOPS_ACR_USERNAME }}
          AIOPS_ACR_PASSWORD: ${{ secrets.AIOPS_ACR_PASSWORD }}
        run: bash ops/environments/gateway/publish-release-image.sh --tag "$TARGET_TAG"
