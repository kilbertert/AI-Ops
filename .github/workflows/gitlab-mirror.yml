name: Mirror to company GitLab

# 镜像推送至公司 GitLab：由 kilbertert/fleet-kit@v1 统一提供零拷贝实现。

on:
  push:
  delete:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    permissions:
      contents: read
    uses: kilbertert/fleet-kit/.github/workflows/gitlab-mirror.yml@v1
    with:
      gitlab_target_url: git.qushiyun.com:801/ai-products/ai-ops.git
    secrets: inherit
