name: Agent Lifecycle

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: agent-lifecycle
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Cancel only obsolete PR agents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: node .sandcastle/queue/retire-runs.mjs
