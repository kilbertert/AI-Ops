name: CD

# 仅部署受保护 main 的 Gateway 提交；部署锁不可取消。其他组件按各自手册交付。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "deploy/deploy-41.sh"
      - "deploy/classify-remote-result.sh"
      - ".github/workflows/cd.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-41:
    if: github.ref == 'refs/heads/main'
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    concurrency:
      group: cd-41-deploy
      cancel-in-progress: false
    runs-on: aiops-deploy
    timeout-minutes: 20

    environment: production-41

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit to deploy
        id: target
        run: |
          set -euo pipefail
          git cat-file -e "${GITHUB_SHA}^{commit}"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install the CD deploy key
        id: cdkey
        env:
          CD_SSH_KEY: ${{ secrets.DEPLOY_41_CD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CD_SSH_KEY" ]; then
            echo "DEPLOY_41_CD_SSH_KEY 未设置 —— CD 拒绝退化到人工密钥" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/id_ed25519_41_cd"
          printf '%s\n' "$CD_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null   # 私钥格式自检，坏密钥在这里就失败
          echo "CD 部署密钥已就位（$(ssh-keygen -lf "$key" | awk '{print $2}')）"

      - name: Verify the CD identity resolves
        env:
          PATH: /home/claude/miniconda3/bin:/home/claude/.local/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          alias_key=$(ssh -G aiops-41-cd 2>/dev/null | awk '$1=="identityfile"{print $2; exit}')
          expanded=${alias_key/#\~/$HOME}
          if [ "$expanded" = "$HOME/.ssh/id_ed25519_41_cd" ]; then
            echo "别名 aiops-41-cd 解析到 CD 密钥（$alias_key）✓"
          else
            echo "别名 aiops-41-cd 未指向 CD 密钥，实际：$alias_key（展开：$expanded）" >&2
            exit 1
          fi
          dev-host show 41 | sed 's/^/  /'

      - name: Deploy
        id: deploy
        env:
          PATH: /home/claude/miniconda3/bin:/home/claude/.local/bin:/usr/local/bin:/usr/bin:/bin
          CD_SSH_ALIAS: aiops-41-cd
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: deploy/deploy-41.sh --commit "$TARGET_SHA"

      - name: Summarize deployment
        if: always()
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo '### Gateway 部署结果'
            echo "- 提交：${TARGET_SHA:-未解析}"
            echo "- 部署步骤：$DEPLOY_RESULT"
            echo '- 失败时查看首个失败步骤，按部署手册核对现役版本与回滚记录。'
            echo '- Java 节点、Dify、H5 与知识服务不由这个 workflow 一并部署。'
            echo '- 业务验收单独记录；操作入口见 docs/agents/actions-delivery.md。'
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    needs: deploy-41
    runs-on: aiops-deploy
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: cd-release-notes
      cancel-in-progress: false
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.deploy-41.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release notes
        id: release
        env:
          PATH: /home/claude/miniconda3/bin:/home/claude/.local/bin:/usr/local/bin:/usr/bin:/bin
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.deploy-41.outputs.sha }}
        run: |
          set -eu
          if ! command -v dev-changelog >/dev/null 2>&1; then
            echo "::error::dev-changelog is not on the self-hosted runner's PATH; it ships with the server release unit" >&2
            exit 1
          fi

          repo_root=$(git rev-parse --show-toplevel)

          git config --local serverPolicy.publishesVersions true
          git config --local serverPolicy.changelogAtRelease true

          version=$(tr -d '[:space:]' < "$repo_root/VERSION")
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty — refusing to publish a release with no version" >&2
            exit 1
          fi

          vtag="v${version}"
          if ! git ls-remote --exit-code origin "refs/tags/$vtag" >/dev/null 2>&1; then
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$vtag" -f message="AI-Ops $version" \
              -f object="$TARGET_SHA" -f type=commit --jq .sha)
            if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$vtag" -f sha="$tag_object" >/dev/null; then
              git fetch origin "refs/tags/$vtag:refs/tags/$vtag"
              [ "$(git rev-parse "$vtag^{commit}")" = "$TARGET_SHA" ] || exit 1
              [ "$(git cat-file -t "$vtag")" = tag ] || exit 1
            fi
          fi
          git fetch origin "refs/tags/$vtag:refs/tags/$vtag"
          tagged_commit=$(git rev-parse "$vtag^{commit}")
          if [ "$tagged_commit" != "$TARGET_SHA" ]; then
            echo "tag $vtag already points at ${tagged_commit:0:12}; leaving it there."
          fi

          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          dev-changelog "$repo_root"
          if [ ! -s "$repo_root/CHANGELOG.md" ]; then
            echo "::error::dev-changelog exited 0 but produced no $repo_root/CHANGELOG.md" >&2
            echo "::error::usual cause: serverPolicy.publishesVersions is not declared in this checkout (it is local git config, never committed)" >&2
            exit 1
          fi
          cp "$repo_root/CHANGELOG.md" "$notes"

          tag="release-${TARGET_SHA:0:12}"
          title="AI-Ops ${version} — deployed ${TARGET_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; updating its notes."
            gh release edit "$tag" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" \
              --target "$TARGET_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          fi

          if [ "$tagged_commit" = "$TARGET_SHA" ] && ! gh release view "$vtag" >/dev/null 2>&1; then
            gh release create "$vtag" --verify-tag \
              --title "AI-Ops ${version}" --notes-file "$notes" --prerelease
          fi

      - name: Report failure
        if: always()
        env:
          RELEASE_RESULT: ${{ job.status }}
          TARGET_SHA: ${{ needs.deploy-41.outputs.sha }}
        run: |
          {
            echo '### 发布说明结果'
            echo "- 已部署提交：$TARGET_SHA"
            echo "- 发布说明作业：$RELEASE_RESULT"
            echo '- Gateway 部署已成功；此作业失败只重跑失败作业，不据此回滚或重启服务。'
            echo '- 业务验收单独记录；操作入口见 docs/agents/actions-delivery.md。'
          } >> "$GITHUB_STEP_SUMMARY"
