[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiops-diagnostics"
version = "1.0.0"
description = "Read-only charging order diagnostic runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "pymysql[rsa]>=1.1.1,<2",
  "redis>=5.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "pyyaml>=6,<7",
  "pillow>=12,<13",
]

[project.scripts]
aiops-admin = "aiops_diagnostics.admin_cli:admin_app"
aiops-tdengine-proxy = "aiops_diagnostics.tdengine_proxy:main"
aiops-gateway = "aiops_diagnostics.gateway_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  # The parallel scheduler. Declared HERE rather than installed ad hoc, because
  # "can the suite run in parallel" must be a property of the environment, not a
  # consequence of someone remembering. Measured 2026-10-23: a fresh worktree venv
  # has no xdist, so `uv run pytest -n auto` dies with `unrecognized arguments: -n`
  # and the only way forward is to drop `-n` — silently back to serial (279 s vs
  # 55 s on this repository).
  "pytest-xdist>=3.6,<4",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diagnostics"]

[tool.hatch.build.targets.wheel.force-include]
"src/aiops_diagnostics/consumer/consumer_language.json" = "aiops_diagnostics/consumer/consumer_language.json"
"src/aiops_diagnostics/faq_catalog.json" = "aiops_diagnostics/faq_catalog.json"
"src/aiops_diagnostics/faq_recommendations.json" = "aiops_diagnostics/faq_recommendations.json"

[tool.pytest.ini_options]
# The scheduler is a declared dev dependency, so `uv sync --dev` — the documented
# first step in README, CI and the sandbox hook — installs it. Measured 2026-10-23:
# 279 s serial vs 55 s parallel on this repository, same tests.
#
# ⚠️ It was NOT possible while xdist was installed ad hoc. `addopts` is applied
# unconditionally, so on any venv that lacked the plugin pytest died with
# `unrecognized arguments: -n` and ran ZERO tests. That failure mode is why this
# line moved out once and is only moving back now that the dependency does.
#
# ⚠️ `-n 4`, not `-n auto`. `auto` is `os.cpu_count()`, and the machine also carries
# sshd, tailscaled, seven self-hosted runners and long-lived agent sessions — measured
# on 2026-10-23, seven concurrent `-n auto` runs drove load average 5.28 → 79, starved
# sshd and dropped the tailnet, i.e. remote management of the host was gone. `-n 4`
# is half an 8-core box and is also right for a 4-core GitHub-hosted runner.
#
# The count is bounded on BOTH axes now: `tests/conftest.py` holds a host-wide slot
# (MAX_CONCURRENT_RUNS), so this number is per run and something else owns how many
# runs exist. Changing one without the other reintroduces the incident.
#
# Ask for serial with `-n 0`, or `./tools/test.sh -n 0`.
addopts = "-q -n 4"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
