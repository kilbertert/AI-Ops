[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiops-diagnostics"
version = "1.43.0"
description = "Read-only charging order diagnostic runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "pymysql[rsa]>=1.1.1,<2",
  "redis>=5.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "pyyaml>=6,<7",
  "pillow>=12,<13",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<8",
  "python-docx>=1.2,<2",
  "olefile>=0.47,<1",
]

[project.scripts]
aiops-admin = "aiops_diagnostics.admin_cli:admin_app"
aiops-tdengine-proxy = "aiops_diagnostics.tdengine_proxy:main"
aiops-gateway = "aiops_diagnostics.gateway_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  # The parallel scheduler. Declared HERE rather than installed ad hoc, because
  # "can the suite run in parallel" must be a property of the environment, not a
  # consequence of someone remembering. Measured 2026-10-23: a fresh worktree venv
  # has no xdist, so `uv run pytest -n auto` dies with `unrecognized arguments: -n`
  # and the only way forward is to drop `-n` — silently back to serial (279 s vs
  # 55 s on this repository).
  "pytest-xdist>=3.6,<4",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diagnostics"]

[tool.hatch.build.targets.wheel.force-include]
"src/aiops_diagnostics/consumer/presentation.json" = "aiops_diagnostics/consumer/presentation.json"
"src/aiops_diagnostics/conversation/faq_catalog.json" = "aiops_diagnostics/conversation/faq_catalog.json"
"src/aiops_diagnostics/conversation/faq_recommendations.json" = "aiops_diagnostics/conversation/faq_recommendations.json"

[tool.pytest.ini_options]
# The scheduler is a declared dev dependency, so `uv sync --dev` — the documented
# first step in README, CI and the sandbox hook — installs it. Measured 2026-10-23:
# 279 s serial vs 55 s parallel on this repository, same tests.
#
# ⚠️ It was NOT possible while xdist was installed ad hoc. `addopts` is applied
# unconditionally, so on any venv that lacked the plugin pytest died with
# `unrecognized arguments: -n` and ran ZERO tests. That failure mode is why this
# line moved out once and is only moving back now that the dependency does.
#
# ⚠️ `-n auto` 并非无上限吃满 `os.cpu_count()`：
# `tests/conftest.py` 中的 `pytest_xdist_auto_num_workers` 会按环境动态定额——
# CI 下固定 4 worker；本机按 `MemAvailable` 自动降至 2 或 1（或按 `AIOPS_PYTEST_WORKERS` 指定），
# 配合 `MALLOC_ARENA_MAX=2` 与宿主机并发槽位锁，防止多项目并发拉爆内存。
#
# Ask for serial with `-n 0`, or `./tools/test.sh -n 0`.
addopts = "-q -n auto"
markers = [
  "docker: tests that start or inspect local Docker containers",
  "browser: tests that drive a headless browser (Playwright/Chromium)",
  "nginx: tests that validate Nginx ingress/egress/TLS deployment configs",
  "deploy_tooling: deployment, installation, and milestone tooling verification tests",
  "slow: tests with wall-clock runtime >= 3s",
]
pythonpath = ["services/dify-console-bridge", "services/dify-login-proxy"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
