[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiops-diagnostics"
version = "0.1.0"
description = "Read-only charging order diagnostic runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymysql>=1.1.1,<2",
  "redis>=5.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.scripts]
aiops = "aiops_diagnostics.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diagnostics"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
