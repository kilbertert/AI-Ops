identity:
  author: trendpower
  name: consumer_knowledge
  label: &id001
    zh_Hans: 检索当前用户适用知识
    en_US: Consumer knowledge retrieval
description:
  human: *id001
  llm: 按需要查询本人订单、状态、账务、知识或人工联系指引，可以多次组合查询。orders返回本人最近5单，latest_order_no是最新订单；status与billing必须给出已确认的order_no；knowledge用query检索操作或政策。账务记录不证明支付渠道扣款/到账，状态记录不能诊断故障原因。
parameters:
- name: knowledge_base_ids
  type: dynamic-select
  form: form
  required: true
  label:
    zh_Hans: 检索知识库
    en_US: Knowledge bases
  human_description:
    zh_Hans: 检索知识库
    en_US: Knowledge bases
  llm_description: Knowledge bases
  multiple: true
- name: data_grant
  type: string
  form: llm
  required: true
  label:
    zh_Hans: 本轮授权（由网关注入）
    en_US: Request grant
  human_description:
    zh_Hans: 本轮授权（由网关注入）
    en_US: Request grant
  llm_description: Request grant
- name: image_text
  type: string
  form: llm
