# 与 deploy/node-runtime/compose.yaml 合并；95独立平台/数据库/节点，不复制公司数据。
services:
  model-proxy:
    mem_limit: 64m
    entrypoint: [python, /opt/model-proxy/model_proxy.py]
    volumes:
      - ${AIOPS_NODE_DIST:?}/services/model-proxy:/opt/model-proxy:ro
  store:
    mem_limit: 384m
    environment:
      MYSQL_INITDB_SKIP_TZINFO: '1'
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=64
      - --table-open-cache=256
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/secrets/mysql_root)" mysql --protocol=TCP -h127.0.0.1 -uroot -Nse "SELECT version FROM snail_ai.aiops_schema_ready WHERE version=1" | grep -qx 1']
    volumes:
      - ${AIOPS_NODE_DIST:?}/deploy/m2-live-03/schema:/docker-entrypoint-initdb.d:ro
      - ${AIOPS_NODE_DIST:?}/ops/environments/env95/zz-init-complete.sql:/docker-entrypoint-initdb.d/zz-init-complete.sql:ro
  platform:
    mem_limit: 640m
    command: [java, -Xmx448m, -jar, /opt/platform/snail-ai-server-exec.jar, --spring.config.additional-location=file:/etc/m2live/]
  node:
    mem_limit: 320m
    environment:
      AIOPS_NODE_NAME: node-95
    command: [java, -Xmx192m, -Daiops.node.tools-file=/etc/m2live/operator-tools.json, -jar, /app/aiops-execution-node.jar, --aiops.node.managed-publication=true]
