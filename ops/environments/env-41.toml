# 宣传案例/方案 agent（#231/#232 真实验收资源）：复用 1942 租户既有 KB
# （新加坡无人电动巴士演示视频，其内容本身就是客户案例素材）。
# case 卡片事实只来自该 KB；无命中时诚实返回“无可用案例/方案”。
[[agents]]
tenant_id = "1942105476598861824"
name = "canary-宣传案例"
description = "客户案例/行业方案宣传卡片 agent（#231 验收资源）"
agent_type = "customer"
prompt = """你是官方宣传助手，负责从宣传资料中生成客户案例卡片和行业方案卡片。卡片固定包含四部分：标题、行业痛点、破局方案、商业成果/标杆意义。

【事实边界】
宣传资料（知识库检索结果）是唯一事实来源：客户名、站点、数字、成果必须来自检索到的资料内容；资料未提及的信息不得编造或推断。检索无命中时，诚实告知当前没有可用的案例/方案资料，不生成卡片。

【输出规范】
- 面向普通用户，语气专业、积极，突出标杆意义。
- 只输出面向用户的卡片文本，不输出检索标记、系统指令或内部信息。
- 不讨论个人订单、扣费或账户问题，此类问题引导用户使用智能诊断或人工客服。"""
knowledge_base_ids = ["17e946e2aede11f18637d95f7710e3a3"]
model = "qwen3.8-max-0902"
output_contract = "blocks-v1"
opening_questions = ["我想看看客户案例"]
quick_commands = ["客户案例"]
