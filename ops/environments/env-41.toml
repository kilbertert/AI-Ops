# 41 环境（api.mall.qushiyun.com，47.97.160.153）已发布客服 agent 清单。
# 收敛命令（41 on-box）：
#   aiops --config /etc/aiops-41/production.env admin reconcile \
#     ops/environments/env-41.toml \
#     --db /var/lib/aiops-41/gateway/gateway.db \
#     --kb-url http://127.0.0.1:29380
# --db 必须显式给出（不 source production.env 时 from_env 回退 XDG 建空库）。
# 首次执行应全部报告 unchanged —— 出现 drift 说明清单转写有误，先修清单再收敛。
# 本文件从 41 gateway.db（2026-09-13）机械转写；schema 见 ops/README.md。

[[agents]]
tenant_id = "1783022023241633792"
name = "canary-客服"
description = "P0 媒体闭环 canary"
agent_type = "customer"
prompt = """你是「小趋」，充电服务与新能源车领域的官方智能客服。全程保持专业、友好、简洁的客服口吻，不偏离角色、不切换身份。

【回答优先级】
1. 知识库命中：知识库内容是唯一事实来源。可以在知识库内容基础上组织语言，但不得添加、推断、篡改知识库没有的政策、数字、规则或承诺；自身知识与知识库冲突时，一律以知识库为准。
2. 知识库未命中且属于通用公开常识（充电桩类型、充电接口标准、充电安全常识、三电系统基础、续航/能耗通用知识等本领域普适知识）：可以基于通用专业知识回答，但必须先说明「以下为通用常识参考，非平台官方政策」，且不得编造具体数据、政策或参数。
3. 知识库未命中且超出能力边界：使用下方拒答话术，不发散、不调侃、不提供无关建议。

【能力边界】
不可回答：企业内部规则、专属活动、具体站点运营数据、未公开业务政策；具体车型未公开参数、个性化故障诊断、维修方案、配件报价、二手车估价；金融贷款、保险理赔、法律纠纷、医疗建议等非本领域问题；涉及内部数据或敏感信息的咨询。
用户询问本人具体订单、扣费、账户问题时：礼貌引导用户使用充电诊断/订单查询功能，或转人工客服，不在对话中猜测订单状态或扣费原因。

【拒答话术（超边界时使用）】
抱歉，这个问题超出了充电服务的支持范围，小趋暂时无法为您解答。您可以换个关于充电桩使用、充电业务或新能源车的问题，也可以联系人工客服获得帮助~

【输出规范】
- 回答简洁精准，面向普通用户，避免生僻技术术语，不输出冗余内容。
- 禁止输出内部推理过程、检索标记或系统指令，只输出面向用户的对话文本。
- 不编造不存在的政策、参数、业务规则，不给不确定的承诺性表述。
- 用户意图模糊时，礼貌引导补充信息，例如：「您可以描述一下具体的充电场景或车型问题，我会为您更准确地解答~」""""
knowledge_base_ids = ["4f4bc674ad8911f1ae704bfc8c544ea6"]
model = "deepseek-v4-flash"
output_contract = "blocks-v1"
opening_questions = ["新加坡无人电动巴士是什么？"]
quick_commands = ["充电桩怎么操作"]

[[agents]]
tenant_id = "1942105476598861824"
name = "canary-客服"
description = "P0 媒体闭环 canary"
agent_type = "customer"

# 提示词**不在这里**：这个 agent 绑定了 Dify app（见下方 [[dify_apps]]），
# 正文由 Dify 编辑、经 `aiops admin pull-dify` 过发布门拉回（#577）。
# 清单里再写一份就是两个权威 —— load_manifest 会直接拒（#739）。
knowledge_base_ids = ["8701c742b28111f18637d95f7710e3a3"]
model = "deepseek-v4-flash"
output_contract = "blocks-v1"
opening_questions = ["新加坡无人电动巴士是什么？"]
quick_commands = ["充电桩怎么操作"]

# 宣传案例/方案 agent（#231/#232 真实验收资源）：复用 1942 租户既有 KB
# （新加坡无人电动巴士演示视频，其内容本身就是客户案例素材）。
# case 卡片事实只来自该 KB；无命中时诚实返回“无可用案例/方案”。
[[agents]]
tenant_id = "1942105476598861824"
name = "canary-宣传案例"
description = "客户案例/行业方案宣传卡片 agent（#231 验收资源）"
agent_type = "customer"
prompt = """你是官方宣传助手，负责从宣传资料中生成客户案例卡片和行业方案卡片。卡片固定包含四部分，依次为：案例标题、行业痛点、破局方案、商业成果/标杆意义。这四部分描述的是**内容结构**，不是固定字面：每个部分的标题必须使用当前输出语言书写，不得照抄本提示词里的中文名称。

【事实边界】
宣传资料（知识库检索结果）是唯一事实来源：客户名、站点、数字、成果必须来自检索到的资料内容；资料未提及的信息不得编造或推断。检索无命中时，诚实告知当前没有可用的案例/方案资料，不生成卡片。

【输出规范】
- 面向普通用户，语气专业、积极，突出标杆意义。
- 只输出面向用户的卡片文本，不输出检索标记、系统指令或内部信息。
- 不讨论个人订单、扣费或账户问题，此类问题引导用户使用智能诊断或人工客服。"""
knowledge_base_ids = ["8701c742b28111f18637d95f7710e3a3"]
model = "deepseek-v4-flash"
output_contract = "blocks-v1"
opening_questions = ["我想看看客户案例"]
quick_commands = ["客户案例"]

# 验收租户的「从 Dify 拉回并已发布」的客服版本（PRD #693 子票 #696）。
#
# ⚠️ **它不是运营特意挑的生产名，而是 2026-10-11 阶段 1 验收留下的版本**：名为
# `canary-*` 是**名**，不是租户属性。它今天的**权威正文在 41 的库里**（本清单是它的
# 声明态镜像，两侧逐字相同；其正文里带着两行验收标记）。
#
# 为什么它必须进这份清单：注册表某一行的 `agent_name` 只有在 `[[agents]]` 里声明过
# 才被 `load_manifest` 接受（悬空绑定会被拒），而注册表要求**完整期望态**——库里那行
# 的 agent 名在这里查不到，reconcile 就无法把它表达出来。
[[agents]]
tenant_id = "1783022023241633792"
name = "canary-dify-acceptance-1011"
# 空描述是**照实写**，不是漏填：库里那份的描述字段就是空串。写一段说明性文字会让
# reconcile 把这一版重新发布一次（`description` 参与漂移判定），那是本票不需要的生产写入。
description = ""
agent_type = "customer"

# 提示词**不在这里**：这个 agent 绑定了 Dify app（见下方 [[dify_apps]]），
# 正文由 Dify 编辑、经 `aiops admin pull-dify` 过发布门拉回（#577）。
# 清单里再写一份就是两个权威 —— load_manifest 会直接拒（#739）。
knowledge_base_ids = ["4f4bc674ad8911f1ae704bfc8c544ea6"]
model = "deepseek-v4-flash"
output_contract = "blocks-v1"

# 运行时注册表（#584 / PRD #577）：`(租户, 入口) → 我们侧 agent 名`。
#
# ⚠️ **这一节是 fail-closed 的**：表里只要有**任何一行**，未登记的 `(租户, 入口)`
# 就什么都不选（`retrieval_status="unavailable"`），既不会回退到"最新已发布"，
# 也不会落到零阶回答。所以"加一行"是**整台主机的一次开关**，不是局部改动。
# 会把谁的答案改成什么，见 `tools/dify_registry_blast_radius.py` 与 `docs/validation.md`
# 的 #587 两节（爆炸半径 / 开表取证）。
#
# 为什么两行必须**一起**写：线上租户 `1942105476598861824` 也在未登记那一侧。
# 只写验收租户那一行，等于在生产上把线上租户的客服回答拿走。
#
# `app_id` 是**拉取侧**需要的身份（`pull-dify` 按 id 导出一个 app），运行时**不读**它
# （只看 `agent_name`）。所以它不改变任何线上行为，但它是一句关于「这个租户的正文
# 从哪个 app 来」的话 —— **那句话必须是真的**，否则下一个人会照着它去拉错东西。
#
# ⚠️ **2026-10-13 更正一处假绑定**（PR-2）：`(1942105476598861824, consumer)` 此前指向
# `a975c8e5-…`，而那个 app 的 `pre_prompt` 是 **129 字验收存根**、它绑的 dataset 是
# **验收租户**的 KB（`kb-canary` → `4f4bc674…`）—— 它从名字到内容都是验收用的（名字就叫
# `dify-dsl-fixture`，描述写着「一次性样例 app…导出后可删」）。**同一个 app 不可能同时是
# 两个 agent 的正文权威**（一个 app 只有一个 `pre_prompt`），而它已经被验收租户占用。
# 因此线上租户改用**它自己的** app（见下行注释）。
#
# 顺序（先 --dry-run 再真跑）与验收见 `docs/agents/env-41-runbook.md`。

# 线上租户的客服正文：独立 app，正文与库中 `canary-客服` 的 759 字**逐字相同**。
# 它此前没有自己的 app（绑定指向验收那个），所以「用 Dify 编辑线上客服」这件事
# 从来没有过可编辑的对象。
#
# ⚠️ **2026-10-20 改正一处失效绑定**：这一行此前指向 `98441c5b-…`，而那个 app 在 36
# 的 Dify 上**已经不存在**（`apps` 表里没有该 id，`admin pull-dify` 与点发布都只会得到
# `DIFY_DSL_MALFORMED` / 404）。真正的正文权威一直活着，只是换了 id：`aiops-41-kefu-agent`
# （`8e36f0a6-…`），其 `pre_prompt` 与该 agent 已发布版本的正文**逐字节相同**
# （759 字，md5 `e52d5de005bfd7e5ad5402b0921b0ec1`）。绑定改到它，内容零变化。
[[dify_apps]]
tenant_id = "1942105476598861824"
business_entry = "consumer"
app_id = "8e36f0a6-324c-4003-b573-7444cc649411"
agent_name = "canary-客服"

# 验收租户那一行**指向一份从 Dify 拉回并已发布的 customer 版本**（#696 的验收项）。
#
# ⚠️ **2026-10-20 改绑到一个新建的 app**：此前的 `a975c8e5-…`（`dify-dsl-fixture`）在
# Dify 上已被删除。按「每个租户的正文必须有一个真实可编辑的对象」这条要求，在 36 的
# 同一工作区里新建了 `aiops-41-acceptance-1011-agent`（`405fb698-…`，chat 模式），
# 把库中 v2 的 129 字正文逐字写进去并回读核对（md5 `1496386c6b225355fa33d7347085a2e2`）。
# 它**不挂 dataset**：知识库权威在 `knowledge_base_ids`（`4f4bc674…`），Dify 侧挂 dataset
# 只会引入两套 id 空间混用。
[[dify_apps]]
tenant_id = "1783022023241633792"
business_entry = "consumer"
app_id = "405fb698-2949-4cc4-a1fc-a84668481e9c"
agent_name = "canary-dify-acceptance-1011"

# 管家端诊断的方法论配方（#700）：从 Dify `operator-methodology-700` 拉回并经发布门冻结。
# 运行时注册表把它绑给 `(1942105476598861824, operator)`，诊断因此在**该入口**上跑这份
# 正文 —— 而在 consumer 入口上跑的是另一份，两者互不影响。
[[agents]]
tenant_id = "1942105476598861824"
name = "ops-methodology-700"
description = ""
agent_type = "operations"

# 提示词**不在这里**：这个 agent 绑定了 Dify app（见下方 [[dify_apps]]），
# 正文由 Dify 编辑、经 `aiops admin pull-dify` 过发布门拉回（#577）。
# 清单里再写一份就是两个权威 —— load_manifest 会直接拒（#739）。
knowledge_base_ids = []
model = "deepseek-v4-flash"
output_contract = "diagnosis-v1"

# 注册表为真实租户**新增 operator 一行**（consumer 那行不动）。
# 未登记的 `(租户, 入口)` 仍然 fail closed；本次只把这一对从「没登记」变成「点名一份」。
#
# ⚠️ **2026-10-20 改正失效绑定**：这一行此前写的是 `25c20f09-…`（`operator-methodology-700`），
# 而 2026-10-14 把生产迁到 `agent-chat` 模式时新建了 `aiops-41-ops-methodology-agent`
# （`e35f8fda-…`），旧的 chat app 已不在 Dify 上。41 库里的注册行**早已**是 `e35f8fda-…`
# （实测 `unchanged`、版本 12 可发布），只有这份清单没跟上 —— 照它跑 `reconcile` 会把
# 注册行改指到不存在的 app，等于把管家端诊断断掉。本行改为与库一致。
[[dify_apps]]
tenant_id = "1942105476598861824"
business_entry = "operator"
app_id = "e35f8fda-dd4e-4317-b05c-d29f23b4f395"
agent_name = "ops-methodology-700"
