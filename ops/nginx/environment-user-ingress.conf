# ── 参数化路径（prefix ^~ + $uri 形状闸 + 方法白名单）───────────────

location ^~ /v1/assistant/questions/ {
    location ~ "^/v1/assistant/questions/qa_[0-9a-f]{32}/events$" {
        if ($aiops_user_entry_bad = 1) { return 403; }
        if ($request_method != GET) { return 405; }
        client_max_body_size 64k;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Last-Event-ID $http_last_event_id;
        include /etc/aiops-access-__ENV__/environment-user-ingress-proxy.inc;
    }
    if ($uri !~ "^(?:/v1/assistant/questions/qa_[0-9a-f]{32}|/v1/assistant/questions/qa_[0-9a-f]{32}/cancel|/v1/assistant/questions/qa_[0-9a-f]{32}/regenerate|/v1/assistant/questions/qa_[0-9a-f]{32}/feedback|/v1/assistant/questions/qa_[0-9a-f]{32}/export)$") { return 404; }
    if ($aiops_user_entry_bad = 1) { return 403; }
    set $aiops_qa_call "${request_method} ${uri}";
    if ($aiops_qa_call !~ "^(?:GET /v1/assistant/questions/qa_[0-9a-f]{32}|POST /v1/assistant/questions/qa_[0-9a-f]{32}/cancel|POST /v1/assistant/questions/qa_[0-9a-f]{32}/regenerate|POST /v1/assistant/questions/qa_[0-9a-f]{32}/feedback|POST /v1/assistant/questions/qa_[0-9a-f]{32}/export)$") {
        return 405;
    }
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    include /etc/aiops-access-__ENV__/environment-user-ingress-proxy.inc;
}

location ^~ /v1/assistant/files/ {
    if ($uri !~ "^(?:/v1/assistant/files/file_[0-9a-f]{32}|/v1/assistant/files/file_[0-9a-f]{32}/preview|/v1/assistant/files/file_[0-9a-f]{32}/download-task)$") { return 404; }
    if ($aiops_user_entry_bad = 1) { return 403; }
    set $aiops_file_call "${request_method} ${uri}";
    if ($aiops_file_call !~ "^(?:GET /v1/assistant/files/file_[0-9a-f]{32}|GET /v1/assistant/files/file_[0-9a-f]{32}/preview|POST /v1/assistant/files/file_[0-9a-f]{32}/download-task)$") {
        return 405;
    }
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    include /etc/aiops-access-__ENV__/environment-user-ingress-proxy.inc;
}

location ^~ /v1/conversations/ {
    if ($uri !~ "^/v1/conversations/conv_[0-9a-f]{32}$") { return 404; }
    if ($aiops_user_entry_bad = 1) { return 403; }
    if ($request_method !~ "^(?:DELETE|GET|PATCH)$") { return 405; }
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    include /etc/aiops-access-__ENV__/environment-user-ingress-proxy.inc;
}

# MediaResourceSigner：签名即授权 —— 不检查 X-Business-Entry，也不透传任何身份头。
location ^~ /v1/media/ {
    if ($uri !~ "^/v1/media/media_[A-Za-z0-9_-]{32}\.[0-9a-f]{24}$") { return 404; }
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    client_max_body_size 64k;
    proxy_set_header Authorization            "";
    proxy_set_header X-Business-Entry         "";
    proxy_set_header X-Third-Session          "";
    proxy_set_header third-session            "";
    proxy_set_header X-AIOps-Source-Key       "";
    proxy_set_header X-AIOps-Environment      "";
    proxy_set_header X-AIOps-Environment-Key  "";
    proxy_set_header X-AIOps-Gateway-Assertion "";
    proxy_set_header X-Forwarded-Host         "";
    proxy_set_header X-Forwarded-Proto        "";
    proxy_set_header Cookie                   "";
    proxy_set_header Host                     $host;
    proxy_set_header X-Real-IP                $remote_addr;
    proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    # 签名 URL 本身就是凭据：URI 不能进 access_log（与 .inc 同款逐 location 关）。
    access_log off;
}

location ^~ /v1/orders/ {
    if ($uri ~ "\.\.") { return 404; }
    if ($uri !~ "^/v1/orders/[A-Za-z0-9_.:-]{1,128}/access$") { return 404; }
    if ($aiops_user_entry_bad = 1) { return 403; }
    if ($request_method != GET) { return 405; }
    client_max_body_size 64k;
    proxy_read_timeout 120s;
    include /etc/aiops-access-__ENV__/environment-user-ingress-proxy.inc;
}

