# 环境既有 HTTPS 域名的**用户助手精确入口**（环境 __ENV__）。
#
# 与 dify-consumer-callback 同一个公司既有 vhost 的 server 块 include 本片，
# 连同 environment-user-ingress-proxy.inc 与 root 现场生成的凭据片
# /etc/aiops-__ENV__/nginx-user-ingress-auth.conf（0600，本仓库不存任何值，
# 生成方式见 ops/environments/gateway/ingress.md「环境用户助手入口」），
# `nginx -t` 后 reload。
#
# **为什么需要**：该 vhost 只装了 /v1/internal/ 回调精确片，正常用户 /v1 一律
# 404——客户端 FAQ/问答/会话从未到过本环境 Gateway。上游固定
# 127.0.0.1:8788（本环境登记端口），不接受用户任意 URL。
#
# **入口分流在 server 上下文完成**（不新增 map，不在 location 内写凭据）：
#   X-Business-Entry: consumer → Authorization 换成本环境服务 Bearer（凭据片值），
#     third-session 转 X-Third-Session，来源密钥清空 —— 走会话解析链；
#   X-Business-Entry: operator → 透传个人 Bearer，清空全部会话头（不混 consumer 会话），
#     注入本环境来源密钥（凭据片值；环境未配来源门即空值，请求落到既有链被拒）——
#     走公司令牌链。凭据与 41 不共享；
#   其他/缺失入口值           → location 内 403，不转发。
# 入口头只决定用哪套凭据处理，身份仍由 Gateway 全量验证；客户端自报的
# X-Third-Session、X-AIOps-Source-Key、X-AIOps-Environment(-Key)、
# X-AIOps-Gateway-Assertion 一律被覆盖或清空，到不了上游。
#
# 路径是精确白名单，唯一声明处 ops/nginx/environment-user-ingress-routes.txt；
# tests/test_environment_user_ingress.py 用真实 nginx 断言其余 /v1 路由一条都不进。
# 管理面（/v1/dify/*、/v1/agents、/v1/operator-*）、/v1/internal/* 不进本片。
# /v1/media/<signed> 是问答正文内签名媒体的同源读取面（MediaResourceSigner），
# <id>/cancel 是前端等待态的停止操作 —— 两者都是现有客户端会发的调用。
#
# **为什么是 location = + ^~ 而不是整片 /v1/ 正则**：正则 location 会被宿主可能
# 存在的 `location ^~ /v1/` 遮蔽；`=` 精确匹配永远优先，`^~` 长前缀在 ^~ 之间
# 按最长胜出，两者都不依赖宿主原有 location 写法。带 ID 的路径在 ^~ 内用
# `$uri` 形状闸收口：/v1/assistant/questions/qa_x/cancel、/v1/conversations/
# conv_x/active-order 这类合法网关路由同样被 404 挡在转发面之外。
# 同一路径两种方法共用一条 location（nginx 不接受重复 location），方法白名单
# 由 location 内的 if 收口 —— 未声明方法一律 405，if 内只有 return，无写语句。

# 凭据片必须最先 include：它定义下面 if/set 引用的全部秘密变量；
# 文件不存在时 nginx -t 直接失败（fail closed），不存在「没带凭据先放行」。
include /etc/aiops-__ENV__/nginx-user-ingress-auth.conf;

# 默认按 operator 处理：透传 Bearer、无会话头、来源密钥取凭据片的 operator 值。
# consumer 分支显式改写成服务 Bearer + 会话转换 + 清空来源密钥。
# 非法入口值不改这组默认（反正 location 里 403 拒掉，不会带着密钥被转发）。
set $aiops_user_entry $http_x_business_entry;
set $aiops_user_authorization $http_authorization;
set $aiops_user_third_session "";
set $aiops_user_source_key $aiops_user_operator_source_key;
if ($aiops_user_entry = consumer) {
    set $aiops_user_authorization $aiops_user_service_authorization;
    set $aiops_user_third_session $http_third_session;
    set $aiops_user_source_key "";
}

# ── 读取面 ──────────────────────────────────────────────────────────
location = /v1/faq/recommendations {
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method != GET) { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

location = /v1/faq/catalog {
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method != GET) { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

location ^~ /v1/assistant/questions/ {
    if ($uri !~ "^/v1/assistant/questions/qa_[0-9a-f]{32}(?:/cancel)?$") { return 404; }
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    # 方法随 URI 形状分流：详情只读 GET、cancel 只写 POST。
    # nginx if 不支持 and/else，拼成「方法 URI」一次判（单层 if，无写语句）。
    set $aiops_qa_call "${request_method} ${uri}";
    if ($aiops_qa_call !~ "^GET /v1/assistant/questions/qa_[0-9a-f]{32}$|^POST /v1/assistant/questions/qa_[0-9a-f]{32}/cancel$") {
        return 405;
    }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

# MediaResourceSigner：32 位 base64url ID + 24 位十六进制签名，GET 同源读签名媒体。
location ^~ /v1/media/ {
    if ($uri !~ "^/v1/media/media_[A-Za-z0-9_-]{32}\.[0-9a-f]{24}$") { return 404; }
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method != GET) { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

location ^~ /v1/conversations/ {
    if ($uri !~ "^/v1/conversations/conv_[0-9a-f]{32}$") { return 404; }
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method !~ "^(?:GET|DELETE)$") { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

# ── 写入面 ──────────────────────────────────────────────────────────
location = /v1/faq/answer {
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method != POST) { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

location = /v1/assistant/questions {
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method != POST) { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}

# 列表读取与新建同一路径两种方法，白名单收口 GET+POST；DELETE 无 ID 时 405。
location = /v1/conversations {
    if ($aiops_user_entry !~ "^(?:consumer|operator)$") { return 403; }
    if ($request_method !~ "^(?:GET|POST)$") { return 405; }
    include /etc/aiops-__ENV__/environment-user-ingress-proxy.inc;
}
