# consumer H5（ulink.h5.mall.qushiyun.com）的助手面窄转发。
#
# 装到 `/www/server/panel/vhost/nginx/extension/ulink.h5.mall.qushiyun.com/`
# （该 vhost 已 include 这个目录），连同 `ulink-h5-assistant-proxy.inc`，
# `nginx -t` 后 reload。
#
# **为什么需要**：这个站只有静态回退。实测
#   GET  /v1/faq/recommendations  → 200 text/html（= index.html，gzip 780 B）
#   POST /v1/assistant/questions  → 405 nginx（静态文件服务不收 POST）
# 即整片 AI 面从没到过网关，用户看到的只是 "Failed to ask"。
# 同路径在 api.mall.qushiyun.com 上是 401 JSON（真的到网关）。见 ADR-0092。
#
# **为什么按方法拆 location，而不是一条路径正则**：`location ~` 只匹配 URI，不看方法。
# 一条路径正则会把 `POST /v1/shortcuts`（创建快捷键，**管理面**）和
# `GET /v1/assistant/questions`（那个方法返回列表，不是前端调的那条）一起放进来。
# 第一版就是这么写的，`tests/test_h5_assistant_routes.py` 当场报出了三条泄漏。
# `limit_except` 在这里不解决问题：它在外层静态回退之后才生效，实测 `POST` 照样进了代理。
# 所以 —— **读的归读、写的归写、同一路径两种方法就拆两条 location**。
#
# 清单的唯一声明处是 ops/nginx/h5-assistant-routes.txt；两边不相等 CI 会红。
# 不整片转发 `/v1/`：网关还有发布、注册表、Dify 运维、知识源写入等端点，
# 那超出一条前端缺陷的范围。

# ── 读：只有 GET（与 HEAD，nginx 视为同一语义）────────────────────────
location ~ "^/v1/(?:faq/(?:recommendations|catalog)|shortcuts)$" {
    if ($request_method != GET) { return 405; }
    include /etc/aiops-41/h5-assistant-proxy.inc;
}

location ~ "^/v1/assistant/questions/qa_[0-9a-f]{32}$" {
    if ($request_method != GET) { return 405; }
    include /etc/aiops-41/h5-assistant-proxy.inc;
}

# MediaResourceSigner: 24随机字节的base64url ID + 24位十六进制签名。
location ~ "^/v1/media/media_[A-Za-z0-9_-]{32}\.[0-9a-f]{24}$" {
    if ($request_method != GET) { return 405; }
    include /etc/aiops-41/h5-assistant-proxy.inc;
}

location ~ "^/v1/(?:health-report-jobs/hrj_[0-9a-f]{32}|standard/diagnoses/dx_[0-9a-f]{32})$" {
    if ($request_method != GET) { return 405; }
    include /etc/aiops-41/h5-assistant-proxy.inc;
}

# ── 写：只有 POST ────────────────────────────────────────────────────
location ~ "^/v1/(?:assistant/questions|faq/answer|health-report-jobs|standard/diagnoses)$" {
    if ($request_method != POST) { return 405; }
    include /etc/aiops-41/h5-assistant-proxy.inc;
}

location ~ "^/v1/(?:assistant/questions/qa_[0-9a-f]{32}/cancel|standard/diagnoses/dx_[0-9a-f]{32}/cancel)$" {
    if ($request_method != POST) { return 405; }
    include /etc/aiops-41/h5-assistant-proxy.inc;
}
