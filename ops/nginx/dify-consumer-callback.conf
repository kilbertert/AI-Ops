# 装入API域名的extension目录；精确匹配优先于App的/v1/代理。
# Dify携带的是一次性取数凭据，不能被App服务令牌替换。
location = /v1/internal/consumer-knowledge {
    if ($request_method != POST) { return 405; }
    client_max_body_size 8k;
    proxy_pass http://172.18.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Third-Session "";
    proxy_set_header X-Business-Entry "";
    proxy_set_header X-AIOps-Source-Key "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location ~ ^/v1/internal/consumer-data/(knowledge|status|billing)$ {
    if ($request_method != POST) { return 405; }
    client_max_body_size 8k;
    proxy_pass http://172.18.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Third-Session "";
    proxy_set_header X-Business-Entry "";
    proxy_set_header X-AIOps-Source-Key "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
