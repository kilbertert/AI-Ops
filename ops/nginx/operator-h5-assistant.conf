# 管家 H5 / 充电桩后台 AI 抽屉同域入口；方法清单是显式白名单，管理与内部回调接口不代理。
location ~ "^/v1/(?:faq/(?:recommendations|catalog)|shortcuts|assistant/(?:agents|starters|questions/qa_[0-9a-f]{32}|files/file_[0-9a-f]{32}(?:/preview)?)|conversations)$" {
    if ($request_method != GET) { return 405; }
    proxy_read_timeout 120s;
    include /etc/aiops-41/operator-h5-proxy.inc;
}
location ~ "^/v1/assistant/questions/qa_[0-9a-f]{32}/events$" {
    if ($request_method != GET) { return 405; }
    proxy_set_header Last-Event-ID $http_last_event_id;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
    include /etc/aiops-41/operator-h5-proxy.inc;
}
location = /v1/assistant/files {
    if ($request_method != POST) { return 405; }
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    include /etc/aiops-41/operator-h5-proxy.inc;
}
location ~ "^/v1/(?:faq/answer|assistant/(?:questions(?:/qa_[0-9a-f]{32}/(?:cancel|regenerate|feedback|export))?|files/file_[0-9a-f]{32}/download-task))$" {
    if ($request_method != POST) { return 405; }
    proxy_read_timeout 120s;
    include /etc/aiops-41/operator-h5-proxy.inc;
}
location ~ "^/v1/conversations/conv_[A-Za-z0-9]{1,57}$" {
    if ($request_method !~ ^(GET|PATCH|DELETE)$) { return 405; }
    proxy_read_timeout 120s;
    include /etc/aiops-41/operator-h5-proxy.inc;
}
