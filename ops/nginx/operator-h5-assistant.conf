# 管家 H5 同域入口；方法清单是显式白名单，管理接口不代理。
location ~ "^/v1/(?:faq/(?:recommendations|catalog)|shortcuts|assistant/questions/qa_[0-9a-f]{32})$" {
    if ($request_method != GET) { return 405; }
    include /etc/aiops-41/operator-h5-proxy.inc;
}
location ~ "^/v1/(?:faq/answer|assistant/questions(?:/qa_[0-9a-f]{32}/cancel)?)$" {
    if ($request_method != POST) { return 405; }
    include /etc/aiops-41/operator-h5-proxy.inc;
}
