# 宿主 nginx：把登录代理挂在**与控制台同源**的前缀下（#778）。
# 装到 /www/server/panel/vhost/nginx/snippets/ 或并入控制台的 server 块。
# 与发布桥（dify-console-publish.conf）同一拓扑：浏览器只跟控制台源说话。

# 登录代理的三跳。全部转发到回环上的 10119。
location = /__aiops/login {
    proxy_pass http://127.0.0.1:10119;
    proxy_set_header Host $host;
    # `$remote_addr` 已被 10008 那一层的 `set_real_ip_from` 修正过（见
    # `dify-console-10008.conf` 顶部）：经 TLS 入口来的请求，这里是**运营的**地址；
    # 直连明文入口的请求，这里是运营自己的对端地址（客户端自带的头不被采信）。
    proxy_set_header X-Real-IP $remote_addr;
    # 协议不能写 `$scheme`：这一层是明文监听，`$scheme` 恒为 http，会把 TLS 入口
    # 写的 https 覆盖掉 —— 而登录代理按它判"这次能不能收口令"（#849）。改用那个
    # map 算出的值：只有对端是回环（= TLS 入口）时才采信上游声明的协议。
    proxy_set_header X-Forwarded-Proto $aiops_upstream_proto;
    # 登录请求体很小（账号+密码+验证码）。
    client_max_body_size 8k;
    proxy_read_timeout 30s;
}

# 发布权/身份查询（#780 / #782）。桥在**同一台机器上直连回环**调它，浏览器不需要
# 这条路由；但把它挂到同源没有任何坏处，且让"代理是否活着"可以用一条 curl 验证。
location = /__aiops/publish/check {
    proxy_pass http://127.0.0.1:10119;
    proxy_set_header Host $host;
    client_max_body_size 8k;
    proxy_read_timeout 30s;
}

location = /__aiops/login/captcha {
    proxy_pass http://127.0.0.1:10119;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /__aiops/login/logout {
    proxy_pass http://127.0.0.1:10119;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
