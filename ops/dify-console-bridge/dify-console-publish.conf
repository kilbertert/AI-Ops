# 控制台按钮的后端桥：同源转发到本机 10118。
location ~ ^/__aiops/operator-preview(?:/cancel)?$ {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $request_id always;
    proxy_buffering off;
    proxy_read_timeout 200s;
    client_max_body_size 64k;
}

# 桥自己做身份（拿浏览器带来的 Dify 会话问 Dify「你是谁」），再做发布或试运行。
#
# 两条 location **共用同一套转发头**：Cookie / CSRF / Referer / Origin / Sec-Fetch-Site
# 一个都不能少 —— 桥那边是同一套浏览器三门（CSRF 缺了是 401，Origin 不对是 403）。
location = /__aiops/publish {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $request_id always;
    client_max_body_size 4k;
}

