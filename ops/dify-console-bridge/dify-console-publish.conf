# 试运行：**同一个桥进程**的另一条路径（#781 / #782 的部署层）。
# 与发布共用一把门、一套头；区别只在 body 要带订单号，所以上限从 4k 放到 32k。
# 桥自己也按 32k 再判一次（`MAX_TRIAL_BODY_BYTES`）—— 两层都要有，前置代理的限额
# 只是第一道，不能被当作唯一一道。
location = /__aiops/trial {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    client_max_body_size 32k;
}

# 试运行结果：与提交**同一个桥进程**，同一套浏览器三门（也同样是 POST ——
# 浏览器的同源 GET 不发 Origin，做成 GET 就得为它单开一套更弱的门）。
# body 只带 trial_id，几百字节；限额与提交一致即可。
location = /__aiops/trial/result {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    client_max_body_size 32k;
}

# 知识库入口的桥转发（#984 / PRD #981）。
#
# 与上面那条发布转发**不是同一套门**，所以也不共用同一个 location：
#
#   * 它是浏览器的**顶层 GET 导航**（新标签），不带 `Origin`、不带 `X-CSRF-Token`；
#     把发布那条的 `client_max_body_size 4k` / Content-Type 强约束照搬过来只会
#     让它在浏览器里 4xx，而发布那条的做法是"缺了就拒"。
#   * 它**不改变状态**：只回答"往哪跳"。真正换会话的那一步在网关。
#   * **`?workspace=` 会被转下去**（`location =` 精确匹配匹配的是 **path**，query 原样保留）。
#     桥确实读它 —— 页面带上来"我此刻在哪个 workspace"（见 `_get_knowledge_open`）。
#     早先这里写着"不读任何 URL 参数"，那句在桥改成从页面取 workspace 之后就不成立了；
#     2026-10-23 在桥日志里实测到 `GET /__aiops/knowledge-open?workspace=c3f871e1-…`，
#     纠正过来。
#   * **它仍然不从 URL 取身份**：租户来自 `Cookie` 里的 Dify 会话经登录代理验证；
#     `workspace` 只是"这页看着是哪个"，换出来的会话仍属于该 workspace 对应的租户，
#     而网关那条路由只认内部令牌 + workspace 反查（#982）。两件事不要混。
location = /__aiops/knowledge-open {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    # 会话原样转下去：桥要拿它去问登录代理"这个会话是谁"。
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    # 303 让浏览器**自己**去 RAGFlow，并把 Set-Cookie 落在那个源上。
    # 关掉缓冲，免得 nginx 把 303 与小 body 卡在一起。
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}

# 票的兑换端点（#985）。
#
# **这条不经过桥**：它由浏览器在 `kb.mall.qushiyun.com` 上直接调用，由 41 的 nginx
# 反代到网关。为什么必须绕开桥：cookie 只能由它所属的域设置，而桥在
# `dify.ranlei.work` 上 —— 它发的 `Domain=.mall.qushiyun.com` 会被浏览器拒收。
#
# 它带不了内部令牌（浏览器导航），所以判据是那张**一次性票**：32 字节随机、60 秒、
# 用一次即废、只在库里与租户关联、不含会话。
#
# ⚠️ 这条 location 的**实际归属是 41 上的 kb.mall 站点**，不是这里 —— 本文件属于 36
# 上的桥。写在这里是作为对照记录（两边路径必须一致），真正生效的配置见
# `docs/agents/env-41-runbook.md` 的「知识库控制台」一节。

# 知识库同步（ADR-0122 / #1056）。
#
# 编排页的「添加知识库」弹窗打开时，前端 POST 一次这里，让网关把 RAGFlow 的新库
# 收敛成 Dify 的 external dataset。运营因此不需要任何人跑
# `aiops-admin sync-knowledge-datasets`。
#
# 与 `knowledge-open` **同一套身份**：租户由桥从 Cookie 里的 Dify 会话解析，工作区
# 是桥自己的固定配置。请求体为空 —— 这里连 `$arg_*` 都不转，因为桥**没有读参数的
# 代码路径**；转了只会让人以为它能指定租户。
#
# 它是 POST（会触发一次写），但**不改这个控制台**：真正的写发生在网关 → Dify
# Console API，而这条路径对浏览器的语义是"顺手让我更省事"。因此它的失败形状是
# **200 + created:0**，不是 5xx —— 一次抖动不该挡住弹窗。
location = /__aiops/knowledge-sync {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    # 空 body，但桥会读一次 Content-Length；显式给个小上限，避免被当成无界请求。
    client_max_body_size 4k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

# Dify组件的固定业务管理动作；凭据仍由服务端持有。
location = /__aiops/manage {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}
