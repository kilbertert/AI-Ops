# 控制台按钮的后端桥：同源转发到本机 10118。
# 桥自己做身份（拿浏览器带来的 Dify 会话问 Dify「你是谁」），再做发布或试运行。
#
# 两条 location **共用同一套转发头**：Cookie / CSRF / Referer / Origin / Sec-Fetch-Site
# 一个都不能少 —— 桥那边是同一套浏览器三门（CSRF 缺了是 401，Origin 不对是 403）。
location = /__aiops/publish {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    # 浏览器那套 console 凭据**原样**转下去：cookie 与 CSRF 都要。
    # 少任何一个，桥问 Dify 都会被拒（CSRF 缺了是 401，不是 403）。
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    client_max_body_size 4k;
}

# 试运行：**同一个桥进程**的另一条路径（#781 / #782 的部署层）。
# 与发布共用一把门、一套头；区别只在 body 要带订单号，所以上限从 4k 放到 32k。
# 桥自己也按 32k 再判一次（`MAX_TRIAL_BODY_BYTES`）—— 两层都要有，前置代理的限额
# 只是第一道，不能被当作唯一一道。
location = /__aiops/trial {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    client_max_body_size 32k;
}
