# 临时服务API入口；来源清单在私有目录，原应用Bearer鉴权仍由Dify执行。
log_format aiops_dify_service '$time_iso8601 $remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 10443 ssl;
    server_name dify.ranlei.work;
    ssl_certificate /www/server/panel/vhost/cert/dify.ranlei.work/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dify.ranlei.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/aiops-dify-api/allowed-sources.conf;
    deny all;
    access_log /www/wwwlogs/aiops-dify-service-api.log aiops_dify_service;
    # nginx错误行包含原始query；状态与耗时保留在上方安全访问日志。
    error_log /dev/null;
    client_max_body_size 3m;

    location ~ ^/v1/(info|parameters|files/upload|chat-messages(/[A-Za-z0-9_-]+/stop)?|workflows/(run|[A-Za-z0-9_-]+/run|tasks/[A-Za-z0-9_-]+/stop))$ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:10018;
        proxy_http_version 1.1;
        proxy_set_header Host dify.ranlei.work;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / { return 404; }
}
