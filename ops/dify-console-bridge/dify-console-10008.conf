# AI-Ops 在 Dify 控制台前的一层（#577 的最后一跳，ADR-0021）。
#
# 为什么有这一层：Dify 自己的 nginx 已经把发布端口收到 127.0.0.1:10018，
# 对外只剩这里。这一层做两件事，**只有第二件是新增行为**：
#   1. 原样转发到 Dify —— 转发必须是透明的，否则控制台会坏；
#   2. 把一颗「发布到 AI-Ops」按钮注入 Dify 的 HTML（见 nginx-inject.conf）。
#
# 注入**只动 HTML**：静态产物是压缩的二进制，sub_filter 不碰；Dify 的 JSON API
# 不带 </body>，也碰不到。所以它的影响面天然只有"页面的骨架"，正好是要的范围。
#
# 失败的方向是安全的：注入不上 = 没有那颗按钮，控制台照常。**绝不影响 Dify 本身。**

map $http_upgrade $dify_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 10008;
    server_name _;

    # 控制台的请求体可以很大（导入 DSL、上传文件）。
    client_max_body_size 100m;

    # ── 发布按钮的后端桥（同源，浏览器自动带 Dify 会话 cookie）──────────────
    include /www/server/panel/vhost/nginx/snippets/dify-console-publish.conf;

    location / {
        proxy_pass http://127.0.0.1:10018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dify_connection_upgrade;
        # Dify 的长连接（SSE / socket.io）与仓库既有的 3600s 口径一致。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # ── 注入 ──────────────────────────────────────────────────────────
        # 只对 HTML 生效；sub_filter_once on 保证只替换第一次 </body>。
        sub_filter '</body>' '<script src="/__aiops/publish-button.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;

        # ⚠️ 这三行是 sub_filter 能工作的前提：上游若返回压缩体，正文就不是明文，
        # 替换静默失败（"看着配了其实没注入"）。Dify 的 nginx 默认开着 gzip。
        proxy_set_header Accept-Encoding "";
        gzip off;
    }

    # 注入脚本本身。它从我们这里出，**不含任何凭据**。
    location = /__aiops/publish-button.js {
        alias /www/server/panel/vhost/nginx/snippets/dify-publish-button.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
}
