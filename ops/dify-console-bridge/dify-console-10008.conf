# AI-Ops 在 Dify 控制台前的一层（#577 的最后一跳，ADR-0021）。
#
# 为什么有这一层：Dify 自己的 nginx 已经把发布端口收到 127.0.0.1:10018，
# 对外只剩这里。这一层做两件事，**只有第二件是新增行为**：
#   1. 原样转发到 Dify —— 转发必须是透明的，否则控制台会坏；
#   2. 把一颗「发布到 AI-Ops」按钮注入 Dify 的 HTML（注入配置见本文件下方）。
#
# 注入**只动 HTML**：静态产物是压缩的二进制，sub_filter 不碰；Dify 的 JSON API
# 不带 </body>，也碰不到。所以它的影响面天然只有"页面的骨架"，正好是要的范围。
#
# 失败的方向是安全的：注入不上 = 没有那颗按钮，控制台照常。**绝不影响 Dify 本身。**

map $http_upgrade $dify_connection_upgrade {
    default upgrade;
    ''      close;
}

# 这个 server 有**两个**入口，而它们对这一层长得一模一样：
#   1. 公网明文 `http://36.156.159.175:10008`  —— 对端就是运营本人；
#   2. 本机 TLS    `https://dify.ranlei.work` —— 对端是 TLS 入口的 nginx（127.0.0.1）。
#
# 登录代理要按「运营是谁」（退避键，#848）与「这次是不是 TLS」（口令闸门，#849）分流，
# 而 `location` 里的 `proxy_set_header X-Real-IP $remote_addr` / `X-Forwarded-Proto $scheme`
# 都只描述**这一跳**：经 TLS 进来的请求到这一层时，两样都已经变成回环地址与明文。
#
# `realip` 在 location 求值**之前**把 `$remote_addr` 修正好，且只对可信来源生效 ——
# 回环对端（= TLS 入口）采信它写的 `X-Real-IP`，其它对端一概不信。于是 snippet 里那行
# `$remote_addr` 拿到的就是真实运营地址，而公网明文入口上客户端自带的头仍然被丢弃。
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Real-IP;
real_ip_recursive off;

# 协议同理，但 nginx 没有"条件地覆盖 `$scheme`"的写法，所以用一个 map 算出该往上报的值：
# 只有真实对端是回环（= 请求来自 TLS 入口）时才采信它声明的协议，其余一律空。
# `$realip_remote_addr` 是 realip 处理**之前**的对端地址 —— 用它判"谁在跟我说话"。
map $realip_remote_addr $aiops_upstream_proto {
    default         "";
    ~^127\.0\.0\.1$ $http_x_forwarded_proto;
    ~^::1$          $http_x_forwarded_proto;
}

server {
    listen 10008;
    server_name _;

    # 来源修正：只信回环对端（= 本机 TLS 入口）。说明见文件顶部那段注释。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # 控制台的请求体可以很大（导入 DSL、上传文件）。
    client_max_body_size 100m;

    # ── 发布按钮的后端桥（同源，浏览器自动带 Dify 会话 cookie）──────────────
    include /www/server/panel/vhost/nginx/snippets/dify-console-publish.conf;

    # ── 公司账号登录代理的三跳（#778 / #783）────────────────────────────────
    # 为什么挂在这一层而不是 TLS 那一层：**这一层被两个入口共用** ——
    # `dify.ranlei.work:443`（TLS 入口）与 `36.156.159.175:10008`（明文入口）都落到这里。
    # 挂在 TLS 层等于给明文入口留一条绕过口，而收口 Dify 原生登录恰恰必须覆盖它。
    # 同一个道理也适用于下面那条 /signin 与登录页：挂一处，两个入口同时生效。
    include /www/server/panel/vhost/nginx/snippets/dify-login-proxy.conf;

    # ── 我们的登录页接管 Dify 原生的 /signin（#783）───────────────────────
    # 这一条同时完成两件事，所以它们不可能是两个会漂的开关：运营看到的是公司账号
    # 登录页，而不是 Dify 自己的邮箱密码框。
    #
    # **精确匹配**（`= /signin`）是刻意的：前缀匹配会把 `/signin/...` 一类路径一起
    # 吃掉，而 Dify 只在那一个路径上渲染登录界面。
    #
    # 与下面 `location /` 的 `sub_filter` 互不影响 —— 精确匹配优先，且 sub_filter
    # 只对 `location /` 生效，所以登录页**不会**被注入发布按钮脚本。这正是要的。
    location = /signin {
        alias /srv/aiops-console-assets/dify-login-page.html;
        default_type text/html;
        # 这一页接公司口令：关到最紧。`unsafe-inline` 只为内联 style/script
        # （单文件资产的前提），除此之外不放任何来源。
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }

    location = /__aiops/login-page {
        alias /srv/aiops-console-assets/dify-login-page.html;
        default_type text/html;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }

    # ── 收口 Dify 原生账号入口（#783 阶段 3）──────────────────────────────────
    #
    # 目标：**公司账号登录成为进入控制台的唯一入口**。不封，运营仍可拿 Dify 邮箱密码
    # 直接登录，公司身份闭环就形同虚设。
    #
    # **为什么封在这一层**：10008 被 `dify.ranlei.work:443` 与明文 `:10008` 两个入口共用；
    # 只封 TLS 层等于给明文入口留一条绕过口（实测两个入口今天都活着）。封一处，两个入口
    # 同时生效 —— 与上面 /signin 同一条道理。
    #
    # **不会打断我们自己的服务端链路**：登录代理与发布桥都直连 `127.0.0.1:10018`
    # （Dify 自己的 nginx），**不经这一层** ⇒ 开户（invite→activate）与发布照常。
    # 这一点是封之前实测确认的，不是推断。
    #
    # 逐路径显式列出而**不用 catch-all**：Dify 对未知路径自己会回 404，
    # catch-all `location /` 会把控制台整个吃掉。
    #
    # **刻意不封的两条**：
    #   · `/console/api/logout` —— 登出是正常流程。
    #   · `/console/api/refresh-token` —— 封了会让"会话过期"变成硬 404，而不是跳登录页；
    #     留着它，refresh 失败后前端会 303 到 `/signin`，**正好落到我们的登录页**。
    location = /signup        { return 404; }
    location = /install       { return 404; }
    location = /forgot-password { return 404; }
    location = /reset-password  { return 404; }
    location = /activate      { return 404; }

    location = /console/api/login            { return 404; }
    location = /console/api/forgot-password  { return 404; }
    location = /console/api/forgot-password/validity { return 404; }
    location = /console/api/forgot-password/resets   { return 404; }
    location = /console/api/reset-password   { return 404; }
    location = /console/api/email-code-login { return 404; }
    location = /console/api/email-code-login/validity { return 404; }
    location = /console/api/email-register   { return 404; }
    location = /console/api/email-register/send-email { return 404; }
    location = /console/api/email-register/validity   { return 404; }
    location = /console/api/activate         { return 404; }
    location = /console/api/activate/check   { return 404; }

    # ── 应急 owner 的原生入口（受控来源）─────────────────────────────────────
    # 收口之后，Dify 原生的邮箱密码登录只剩这一条路：**只绑回环的 10009**。
    # 用 SSH 隧道进：`ssh -N -L 10009:127.0.0.1:10009 yidong-36`，然后
    # 浏览器开 `http://127.0.0.1:10009/signin`。
    #
    # 为什么是"只绑回环"而不是 IP 白名单：白名单要靠人维护（工程师出口 IP 会变），
    # 而且一旦写宽就是永久敞口。回环 + SSH 与既有运维方式一致，也不需要新的暴露决策。
    #
    # ⚠️ 它**不在**本 server 块里（listen 不同），所以是同一文件里的**另一个 server**。
    # 见本文件末尾。

    location / {
        proxy_pass http://127.0.0.1:10018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dify_connection_upgrade;
        # Dify 的长连接（SSE / socket.io）与仓库既有的 3600s 口径一致。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # ── 注入 ──────────────────────────────────────────────────────────
        # 只对 HTML 生效；sub_filter_once on 保证只替换第一次 </body>。
        sub_filter '</body>' '<script src="/__aiops/publish-button.js"></script><script src="/__aiops/dify-knowledge-open.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;

        # ⚠️ 这三行是 sub_filter 能工作的前提：上游若返回压缩体，正文就不是明文，
        # 替换静默失败（"看着配了其实没注入"）。Dify 的 nginx 默认开着 gzip。
        proxy_set_header Accept-Encoding "";
        gzip off;
    }

    # 注入脚本本身。它从我们这里出，**不含任何凭据**。
    location = /__aiops/publish-button.js {
        alias /srv/aiops-console-assets/dify-publish-button.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # 知识库入口的脚本（#983 / PRD #981）。与上面那颗按钮同一通道：从我们这里出，
    # 不含任何凭据。它自己判"是不是知识库页"，所以整个控制台都会加载它 ——
    # 那是它安静待在别处的前提，也是它必须静默降级的原因。
    location = /__aiops/dify-knowledge-open.js {
        alias /srv/aiops-console-assets/dify-knowledge-open.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
}

# ── 应急 owner 的原生登录入口（#783 阶段 3）───────────────────────────────────
#
# 收口之后 Dify 原生登录只剩这一条：**只绑回环**，公网任何地址都不可达。
# 用法（写在这里，因为"怎么进去"是这条规则的一部分）：
#
#     ssh -N -L 10009:127.0.0.1:10009 yidong-36
#     浏览器开 http://127.0.0.1:10009/signin
#
# 它**原样反代到 10018**（Dify 自己的 nginx）：不在上面那些封禁路径的作用范围内，
# 所以原生登录/找回密码在这里都能用 —— 这正是"应急"的含义。
#
# ⚠️ 不绑 `0.0.0.0`。绑了就等于给公网留一个绕过全部收口的入口，
# 而那与"应急"是两件事。
server {
    listen 127.0.0.1:10009;
    server_name _;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:10018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dify_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
