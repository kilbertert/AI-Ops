# Dify 控制台的 **TLS 域名入口**（#776）。装到 /www/server/panel/vhost/nginx/ (36)。
#
# 与 dify-console-10008.conf 的关系：**这一层不重复实现控制台**。
#   浏览器 ──► dify.ranlei.work:443（本文件）
#                 └─► 127.0.0.1:10008（dify-console-10008.conf：转发 + 注入 + 出版桥）
#                        └─► 127.0.0.1:10018（Dify 自己的 nginx）
#
# 为什么反代到 10008 而不是 10018：10008 那一层承担着**转发、HTML 注入、发布按钮脚本、
# 发布桥**四件事（见该文件的注释）。指到 10018 会把注入与桥整个绕过 —— 发布按钮消失、
# 桥的两个 location 不可达。指到 10008 = 透明复用，改一处而不重抄。
#
# 为什么 10008 保留：它是本次变更的**回滚路径**。退役是另一件有观测依据的单独动作。

# ── 80：只做两件事 —— ACME 验证与跳转 ─────────────────────────────────────────
# 证书签发（http-01）要求这个域名在 80 上能被 LE 读到验证文件；其余一律跳 https。
server {
    listen 80;
    listen [::]:80;
    server_name dify.ranlei.work;

    # acme.sh --webroot 把验证文件写在这里。**只放这一个前缀**，不给整站 root。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/dify.ranlei.work;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443：TLS 入口 ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dify.ranlei.work;

    # Let's Encrypt。证书由 deploy-hook 从 `/etc/letsencrypt/live/` **拷到**这里
    # （`/etc/letsencrypt/renewal-hooks/deploy/10-reload-nginx.sh`），与既有
    # `*.xyseeker.com` 站点的目录约定一致。
    # ⚠️ **不要直接指向 `/etc/letsencrypt/live/`**：那是 `700 root`，nginx **worker**
    # （宝塔下是 `systemd+` 身份）读不到 —— 现在能起只是因为 master 以 root 解析配置，
    # 那是个不该依赖的隐含假设。拷贝这一步换来的是"worker 真的能读到"。
    # 续期 → 拷贝 → `nginx -t && nginx -s reload` 全在那条 deploy-hook 里。
    ssl_certificate     /www/server/panel/vhost/cert/dify.ranlei.work/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dify.ranlei.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ⚠️ **这个入口此前没有任何访问日志**（#776 核实：10008 的 server 块不含 access_log，
    # 全局那条写在 http 块内一个 location 里、作用域无效）。于是"10008 有多少人在用"
    # 这个问题在本机上**无法回答**，而退役它恰恰需要这个依据。从这里开始补上。
    access_log /www/wwwlogs/dify.ranlei.work.log;
    error_log  /www/wwwlogs/dify.ranlei.work.error.log;

    # 控制台的请求体可以很大（导入 DSL、上传文件）—— 与 10008 层同一口径。
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:10008;
        proxy_http_version 1.1;
        # Host 要**原样**传下去（不能写成 127.0.0.1）：下游的桥按 Referer/Origin 逐字
        # 比对控制台公开源（dify_console_publish.py），换了 host 就全拒。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dify_connection_upgrade;
        # Dify 的长连接（SSE / socket.io）与仓库既有的 3600s 口径一致。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # ⚠️ 这三行**必须在这里再写一遍**，不能指望 10008 那一层的注入生效。
        # nginx 的 sub_filter 是**逐层独立**的：10008 内层确实替换了一次（注入成功），
        # 但替换后的正文回到这一层时我们并不认识它 —— 而 10008 是**多层**的
        # proxy_pass，若内层已注入、外层再匹配一次就会出两份脚本。
        # 实测判据见 README「四处容易踩空」第 4 条：页面里
        # `/__aiops/publish-button.js` 必须**恰好出现一次**。
        # 当前 10008 已验证会注入且只注入一次，因此**这一层只做透传、不重复注入**：
        # 把上游的压缩关掉这件事故意不在这里做（内层已 `gzip off` 且清空 Accept-Encoding）。
        #
        # 若将来把注入从内层挪到这一层，务必同时删掉内层那份 —— 两者只能留一处。
    }
}

# `$dify_connection_upgrade` 这个 map 由 dify-console-10008.conf 定义（同一台 nginx 的
# http 块内，map 是全局可见的），所以这里**不能重复声明** —— 重复定义 map 会让
# `nginx -t` 报 "duplicate map name"。本文件只引用它。
