# AI-Ops 在 Dify 控制台里注入的那颗「发布到 AI-Ops」按钮（#577 的最后一跳）。
#
# 这个文件由宿主 nginx 的 10008 server 块 include。它做两件事：
#   1. 把一段极小的脚本 sub_filter 进 Dify 的 HTML（按钮 + 一次 fetch）；
#   2. 把 /__aiops/publish 转到本机的桥（桥再做身份与发布）。
#
# 注入的脚本**不含任何凭据**：它打的 /__aiops/publish 是同源的，浏览器自动带上
# Dify 自己的会话 cookie；真正那把发布密钥在桥的服务端配置里。

location = /__aiops/publish {
    proxy_pass http://127.0.0.1:10118;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Referer $http_referer;
    proxy_set_header Content-Type $http_content_type;
    # 桥自会限长；这里把上限钉死，别让它成为一个可以灌东西的入口。
    client_max_body_size 4k;
}
