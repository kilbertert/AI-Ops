# 知识库一次性票的兑换端点（#985 / PRD #981）。
#
# 装在 **41** 的 `/www/server/panel/vhost/nginx/kb.mall.qushiyun.com.conf`（443 server
# 块内），必须放在 `location /` **之前** —— nginx 前缀 location 取最长匹配，但把它写在
# 前面能让读的人一眼看到"这里有一条特殊路径"。
#
# 为什么这条必须存在于 kb.mall 这个域上：
#   浏览器只接受**由它所属的域**设置的 cookie。桥在 `dify.ranlei.work` 上，它发
#   `Set-Cookie: session=…; Domain=.mall.qushiyun.com` 会被静默拒收 —— 实测现象是
#   "跳过去了、落在登录页、没有任何报错"。所以兑换必须发生在 kb.mall 自己这里。
location = /__aiops/knowledge/hop {
    proxy_pass http://172.18.0.1:8788/v1/internal/knowledge/hop;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # **不转发任何查询参数以外的身份信息**：租户来自那张票在网关库里那一行，
    # 不来自这个请求。`$request_uri` 原样带给网关（它要 `?ticket=`）。
    # 303 与 Set-Cookie 必须原样回到浏览器。
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}
