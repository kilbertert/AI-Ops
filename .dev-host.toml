# AI-Ops 可访问主机声明
#
# 本文件是"项目侧"声明,由 dev-host 读取。与之配对的是"主机侧"清单
# `~/.config/dev-host/hosts.toml`(库外 600),那里记角色、信任平面、
# 归属、访问方式与主机公钥。
#
# 为什么分成两半:本文件进仓库、可被评审,所以**只写逻辑名与路径**;
# 地址、指纹、凭据一律留在库外。这样本文件可以安全地进公开仓库。
#
# 用法:
#   cd <repo> && dev-host show 41
#   dev-host exec 41 --allow-service-exec -- systemctl is-active aiops-gateway-41.service
#
# 注意:41 是服务类主机,写入需要产物身份(`--artifact-sha256`),
# `exec` 需要显式 `--allow-service-exec`;只读用 read/ls/find,不受限。

[[targets]]
name        = "41"
host        = "aiops-41"
description = "AI-Ops Gateway 生产环境(公网入口 api.mall.qushiyun.com)"

[targets.paths]
app  = "/opt/aiops-41/src"
logs = "/var/log/aiops-41"
ops  = "/opt/aiops-41/ops"
onboarding_assets = "/var/lib/aiops-41/onboarding-assets"
backups = "/var/backups/aiops-41"
node_artifacts = "/opt/aiops-node-runtime"
node_config = "/etc/aiops-node-runtime"
node_state = "/var/lib/aiops-node-runtime"

[[targets]]
name        = "36"
host        = "yidong-36"
description = "移动云 36 服务宿主:Dify 编排实例(/opt/dify,入口 :10008)"

[targets.paths]
app  = "/opt/dify"           # compose、env、镜像内数据卷的根
assets = "/opt/dify/deploy"  # 部署产物落点(compose + nginx/ssrf 资产)
kb_service = "/opt/ragflow-kb/kb-service"
kb_backups = "/opt/ragflow-kb/backups"
service_api_config = "/etc/aiops-dify-api"
service_api_nginx = "/www/server/panel/vhost/nginx/aiops-dify-service-api.conf"

[[targets]]
name        = "95"
host        = "qy-gw-120"
description = "另一套 AI-Ops 环境:公网入口 api.qumall.qushiyun.com。公司环境、未纳入本编队;事实与已知空白见 docs/agents/env-95-facts.md"

[targets.paths]
app  = "/home/aiops/AI-Ops"
venv = "/home/aiops/AI-Ops/.venv"
db   = "/home/aiops/.local/share/aiops-diagnostics/gateway/gateway.db"
config = "/home/aiops/.config/aiops-diagnostics"
release = "/opt/aiops-95"
new_config = "/etc/aiops-95"
new_state = "/var/lib/aiops-95"
backups = "/var/backups/aiops-95"
# 空机初装(ADR-0308)的新根；旧/opt/aiops-95根只作恢复资料，不恢复沿用。
access = "/opt/aiops-access-95"
access_config = "/etc/aiops-access-95"
access_state = "/var/lib/aiops-access-95"
access_backups = "/var/backups/aiops-access-95"
node_artifacts = "/opt/aiops-node-runtime"
node_config = "/etc/aiops-node-runtime"
node_state = "/var/lib/aiops-node-runtime"

# 95重建的项目制品与独立状态路径；旧路径在env-95-facts手册保留为恢复资料。

# 候选预演与后续开通使用已登记服务宿主；此声明不授权公网暴露或公司服务变更。
[[targets]]
name = "124"
host = "singapore-server"
description = "第二业务环境候选，仅自有模块预演"
[targets.paths]
candidate = "/opt/aiops-candidate"
access = "/opt/aiops-access-124"
access_config = "/etc/aiops-access-124"
access_state = "/var/lib/aiops-access-124"
access_backups = "/var/backups/aiops-access-124"
# 已获准的独立空实例：仅完整冷装/恢复验收，不复用现役目录或业务凭据。
acceptance_app = "/opt/aiops-access-p3-acceptance"
acceptance_config = "/etc/aiops-access-p3-acceptance"
acceptance_state = "/var/lib/aiops-access-p3-acceptance"
acceptance_backups = "/var/backups/aiops-access-p3-acceptance"
acceptance_staging = "/var/backups/aiops-p3-acceptance-staging"

# 仅作既有95受管SSH的维护中继；不承载AI-Ops业务或保存目标凭据。
[[targets]]
name = "management-relay"
host = "node"
description = "已登记Windows设备：95管理链只读预检及获准转发；非业务部署目标"
